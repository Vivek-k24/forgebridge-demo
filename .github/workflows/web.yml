name: Web CI/CD

on:
  pull_request:
    paths:
      - 'web/**'
      - 'compose.yaml'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'compose.yaml'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Web test + security + container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Verify Web dependency integrity
        working-directory: web
        run: |
          npm ls --all
          sha256sum package-lock.json

      - name: Audit Web dependencies
        working-directory: web
        env:
          NPM_CONFIG_FETCH_TIMEOUT: '30000'
          NPM_CONFIG_FETCH_RETRIES: '0'
        run: |
          for attempt in 1 2 3; do
            set +e
            audit_output="$(npm audit --audit-level=high 2>&1)"
            audit_status=$?
            set -e
            printf '%s\n' "$audit_output"

            if [ "$audit_status" -eq 0 ]; then
              exit 0
            fi

            if printf '%s\n' "$audit_output" | grep -Eqi '503 Service Unavailable|network timeout|audit endpoint returned an error|ECONNRESET|ECONNREFUSED|ETIMEDOUT|EAI_AGAIN'; then
              if [ "$attempt" -lt 3 ]; then
                echo "npm audit service unavailable; retrying attempt $((attempt + 1))/3..."
                sleep $((attempt * 5))
                continue
              fi
              echo '::warning::npm audit advisory service remained unavailable after 3 attempts. Dependency integrity passed; the advisory scan is explicitly degraded for this run.'
              exit 0
            fi

            exit "$audit_status"
          done

      - name: Typecheck web
        working-directory: web
        run: npm run typecheck

      - name: Build web
        working-directory: web
        env:
          VITE_API_BASE_URL: ''
        run: npm run build

      - name: Build production web container
        run: docker build --build-arg VITE_API_BASE_URL= -t partgraph-web:ci ./web

      - name: Smoke-test web container over HTTP and security headers
        run: |
          docker run -d --name partgraph-web-ci -p 8080:80 partgraph-web:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null; then
              curl --fail --silent --show-error -I http://127.0.0.1:8080/ | grep -qi 'X-Frame-Options: DENY'
              curl --fail --silent --show-error -I http://127.0.0.1:8080/ | grep -qi 'Content-Security-Policy:'
              exit 0
            fi
            sleep 1
          done
          docker logs partgraph-web-ci
          exit 1

      - name: Stop web smoke container
        if: always()
        run: docker rm -f partgraph-web-ci >/dev/null 2>&1 || true

  publish:
    name: Publish Web image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish Web image
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER_LC}/partgraph-web"
          docker build --build-arg VITE_API_BASE_URL= \
            -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:main" ./web
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:main"
          {
            echo '### PartGraph Web delivery'
            echo "- Image: \`$IMAGE:$GITHUB_SHA\`"
            echo "- Rolling tag: \`$IMAGE:main\`"
            echo "- [GHCR package](https://github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/package/partgraph-web)"
          } >> "$GITHUB_STEP_SUMMARY"
