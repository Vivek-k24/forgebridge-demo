name: Trim Catalog Probe

on:
  push:
    branches:
      - partgraph-trim-catalog-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trimprobe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trimprobe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Download official NHTSA vPIC PostgreSQL database
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/vpic.zip \
            https://vpic.nhtsa.dot.gov/downloads/vPICList_lite_2026_08.custom.zip
          unzip -o /tmp/vpic.zip -d /tmp/vpic

      - name: Restore vPIC database with PostgreSQL 18 client
        run: |
          set -euo pipefail
          DUMP="$(find /tmp/vpic -type f | head -n 1)"
          CID="${{ job.services.postgres.id }}"
          docker cp "$DUMP" "$CID:/tmp/vpic.backup"
          docker exec -e PGPASSWORD=postgres "$CID" \
            pg_restore --username postgres --dbname trimprobe \
              --no-owner --no-privileges /tmp/vpic.backup

      - name: Compare trim and series fields across representative models
        run: |
          set -euo pipefail
          CID="${{ job.services.postgres.id }}"
          docker exec -i -e PGPASSWORD=postgres "$CID" \
            psql -U postgres -d trimprobe -v ON_ERROR_STOP=1 <<'SQL'
          WITH targets(label, yr, make_name, model_name) AS (
            VALUES
              ('2009 Honda Civic', 2009, 'HONDA', 'CIVIC'),
              ('2015 Ford F-150', 2015, 'FORD', 'F-150'),
              ('2023 Toyota Camry', 2023, 'TOYOTA', 'CAMRY'),
              ('2022 Hyundai Tucson', 2022, 'HYUNDAI', 'TUCSON'),
              ('2021 Mazda CX-5', 2021, 'MAZDA', 'CX-5'),
              ('2019 Infiniti QX60', 2019, 'INFINITI', 'QX60'),
              ('2020 Volvo XC60', 2020, 'VOLVO', 'XC60'),
              ('2020 Lincoln Corsair', 2020, 'LINCOLN', 'CORSAIR'),
              ('2020 Subaru Outback', 2020, 'SUBARU', 'OUTBACK'),
              ('2010 Volkswagen Jetta', 2010, 'VOLKSWAGEN', 'JETTA'),
              ('2010 Suzuki SX4', 2010, 'SUZUKI', 'SX4'),
              ('2006 Scion xB', 2006, 'SCION', 'XB'),
              ('2009 Pontiac G6', 2009, 'PONTIAC', 'G6')
          ), target_ids AS (
            SELECT t.*, mk.id AS make_id, mo.id AS model_id
            FROM targets t
            JOIN vpic.make mk ON upper(mk.name) = t.make_name
            JOIN vpic.make_model mm ON mm.makeid = mk.id
            JOIN vpic.model mo ON mo.id = mm.modelid
                              AND upper(mo.name) = t.model_name
          ), model_schemas AS (
            SELECT DISTINCT
              t.label,
              t.yr,
              t.make_id,
              t.model_id,
              p.vinschemaid
            FROM target_ids t
            JOIN vpic.pattern p ON p.elementid = 28
                               AND p.attributeid::text = t.model_id::text
            JOIN vpic.wmi_vinschema wvs ON wvs.vinschemaid = p.vinschemaid
            JOIN vpic.wmi w ON w.id = wvs.wmiid
            JOIN vpic.wmi_make wm ON wm.wmiid = w.id
                                 AND wm.makeid = t.make_id
            WHERE t.yr BETWEEN wvs.yearfrom AND COALESCE(wvs.yearto, 2999)
          ), candidates AS (
            SELECT DISTINCT
              ms.label,
              e.name AS element,
              p.attributeid AS value
            FROM model_schemas ms
            JOIN vpic.pattern p ON p.vinschemaid = ms.vinschemaid
                               AND p.elementid IN (34, 38, 109, 110)
            JOIN vpic.element e ON e.id = p.elementid
            WHERE NULLIF(btrim(p.attributeid::text), '') IS NOT NULL
          )
          SELECT label,
                 element,
                 string_agg(DISTINCT value::text, ' | ' ORDER BY value::text) AS values
          FROM candidates
          GROUP BY label, element
          ORDER BY label, element;
          SQL

      - name: Count model schemas and direct trim coverage
        run: |
          set -euo pipefail
          CID="${{ job.services.postgres.id }}"
          docker exec -i -e PGPASSWORD=postgres "$CID" \
            psql -U postgres -d trimprobe -v ON_ERROR_STOP=1 <<'SQL'
          WITH supported(make_name) AS (
            VALUES
              ('ACURA'),('BUICK'),('CADILLAC'),('CHEVROLET'),('CHRYSLER'),('DODGE'),
              ('FORD'),('GENESIS'),('GMC'),('HONDA'),('HYUNDAI'),('INFINITI'),('JEEP'),
              ('KIA'),('LEXUS'),('LINCOLN'),('MAZDA'),('MITSUBISHI'),('NISSAN'),('RAM'),
              ('SUBARU'),('TOYOTA'),('VOLKSWAGEN'),('VOLVO'),('HUMMER'),('ISUZU'),
              ('MERCURY'),('PONTIAC'),('SATURN'),('SCION'),('SUZUKI')
          )
          SELECT mk.name AS make,
                 count(DISTINCT p.vinschemaid) FILTER (WHERE p.elementid = 28) AS model_schemas,
                 count(DISTINCT p.vinschemaid) FILTER (WHERE p.elementid IN (34,38,109,110)) AS trim_series_schemas,
                 count(DISTINCT p.attributeid) FILTER (WHERE p.elementid = 38) AS trim_values,
                 count(DISTINCT p.attributeid) FILTER (WHERE p.elementid = 34) AS series_values
          FROM supported s
          JOIN vpic.make mk ON upper(mk.name) = s.make_name
          JOIN vpic.wmi_make wm ON wm.makeid = mk.id
          JOIN vpic.wmi_vinschema wvs ON wvs.wmiid = wm.wmiid
          JOIN vpic.pattern p ON p.vinschemaid = wvs.vinschemaid
          GROUP BY mk.name
          ORDER BY mk.name;
          SQL
