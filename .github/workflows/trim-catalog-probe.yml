name: Trim Catalog Probe

on:
  push:
    branches:
      - partgraph-trim-catalog-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trimprobe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trimprobe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Download official NHTSA vPIC PostgreSQL database
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/vpic.zip \
            https://vpic.nhtsa.dot.gov/downloads/vPICList_lite_2026_08.custom.zip
          unzip -o /tmp/vpic.zip -d /tmp/vpic

      - name: Restore vPIC database with PostgreSQL 18 client
        run: |
          set -euo pipefail
          DUMP="$(find /tmp/vpic -type f | head -n 1)"
          CID="${{ job.services.postgres.id }}"
          docker cp "$DUMP" "$CID:/tmp/vpic.backup"
          docker exec -e PGPASSWORD=postgres "$CID" \
            pg_restore --username postgres --dbname trimprobe \
              --no-owner --no-privileges /tmp/vpic.backup

      - name: Inspect trim element definitions
        run: |
          set -euo pipefail
          CID="${{ job.services.postgres.id }}"
          docker exec -i -e PGPASSWORD=postgres "$CID" \
            psql -U postgres -d trimprobe -v ON_ERROR_STOP=1 <<'SQL'
          SELECT id, name, datatype
          FROM vpic.element
          WHERE id IN (28, 34, 38, 109, 110)
          ORDER BY id;
          SQL

      - name: Inspect 2009 Honda Civic vehicle-spec rows
        run: |
          set -euo pipefail
          CID="${{ job.services.postgres.id }}"
          docker exec -i -e PGPASSWORD=postgres "$CID" \
            psql -U postgres -d trimprobe -v ON_ERROR_STOP=1 <<'SQL'
          WITH target AS (
            SELECT mk.id AS make_id, mo.id AS model_id
            FROM vpic.make_model mm
            JOIN vpic.make mk ON mk.id = mm.makeid
            JOIN vpic.model mo ON mo.id = mm.modelid
            WHERE upper(mk.name) = 'HONDA'
              AND upper(mo.name) = 'CIVIC'
          )
          SELECT DISTINCT
            e.name AS element,
            vsp.attributeid,
            vsp.iskey,
            vssy.year,
            s.id AS vehicle_spec_schema_id,
            vsp.vspecschemapatternid
          FROM vpic.vehiclespecschema s
          JOIN target t ON t.make_id = s.makeid
          JOIN vpic.vehiclespecschema_model vssm
            ON vssm.vehiclespecschemaid = s.id
           AND vssm.modelid = t.model_id
          LEFT JOIN vpic.vehiclespecschema_year vssy
            ON vssy.vehiclespecschemaid = s.id
          JOIN vpic.vspecschemapattern vssp ON vssp.schemaid = s.id
          JOIN vpic.vehiclespecpattern vsp
            ON vsp.vspecschemapatternid = vssp.id
          JOIN vpic.element e ON e.id = vsp.elementid
          WHERE (vssy.year = 2009 OR vssy.id IS NULL)
            AND e.id IN (34, 38, 109, 110)
          ORDER BY element, attributeid, vsp.iskey, vssy.year NULLS FIRST;
          SQL

      - name: Inspect exact-key Civic VIN-pattern trims
        run: |
          set -euo pipefail
          CID="${{ job.services.postgres.id }}"
          docker exec -i -e PGPASSWORD=postgres "$CID" \
            psql -U postgres -d trimprobe -v ON_ERROR_STOP=1 <<'SQL'
          WITH target AS (
            SELECT mk.id AS make_id, mo.id AS model_id
            FROM vpic.make_model mm
            JOIN vpic.make mk ON mk.id = mm.makeid
            JOIN vpic.model mo ON mo.id = mm.modelid
            WHERE upper(mk.name) = 'HONDA'
              AND upper(mo.name) = 'CIVIC'
          ), model_patterns AS (
            SELECT DISTINCT p.vinschemaid, p.keys, p.attributeid AS model_attribute
            FROM vpic.pattern p
            JOIN target t ON p.elementid = 28
                         AND p.attributeid::text = t.model_id::text
            JOIN vpic.wmi_vinschema wvs ON wvs.vinschemaid = p.vinschemaid
            JOIN vpic.wmi w ON w.id = wvs.wmiid
            JOIN vpic.wmi_make wm ON wm.wmiid = w.id
            JOIN target t2 ON t2.make_id = wm.makeid
            WHERE 2009 BETWEEN wvs.yearfrom AND COALESCE(wvs.yearto, 2999)
          )
          SELECT DISTINCT
            mp.vinschemaid,
            mp.keys AS model_keys,
            e.name AS element,
            tp.keys AS trim_keys,
            tp.attributeid AS trim_value
          FROM model_patterns mp
          JOIN vpic.pattern tp
            ON tp.vinschemaid = mp.vinschemaid
           AND tp.keys = mp.keys
           AND tp.elementid IN (34, 38, 109, 110)
          JOIN vpic.element e ON e.id = tp.elementid
          ORDER BY mp.vinschemaid, model_keys, element, trim_value;
          SQL

      - name: Inspect all trim patterns in Civic VIN schemas
        run: |
          set -euo pipefail
          CID="${{ job.services.postgres.id }}"
          docker exec -i -e PGPASSWORD=postgres "$CID" \
            psql -U postgres -d trimprobe -v ON_ERROR_STOP=1 <<'SQL'
          WITH target AS (
            SELECT mk.id AS make_id, mo.id AS model_id
            FROM vpic.make_model mm
            JOIN vpic.make mk ON mk.id = mm.makeid
            JOIN vpic.model mo ON mo.id = mm.modelid
            WHERE upper(mk.name) = 'HONDA'
              AND upper(mo.name) = 'CIVIC'
          ), model_patterns AS (
            SELECT DISTINCT p.vinschemaid, p.keys
            FROM vpic.pattern p
            JOIN target t ON p.elementid = 28
                         AND p.attributeid::text = t.model_id::text
            JOIN vpic.wmi_vinschema wvs ON wvs.vinschemaid = p.vinschemaid
            JOIN vpic.wmi w ON w.id = wvs.wmiid
            JOIN vpic.wmi_make wm ON wm.wmiid = w.id
            JOIN target t2 ON t2.make_id = wm.makeid
            WHERE 2009 BETWEEN wvs.yearfrom AND COALESCE(wvs.yearto, 2999)
          )
          SELECT DISTINCT
            mp.vinschemaid,
            mp.keys AS model_keys,
            e.name AS element,
            tp.keys AS trim_keys,
            tp.attributeid AS trim_value
          FROM model_patterns mp
          JOIN vpic.pattern tp
            ON tp.vinschemaid = mp.vinschemaid
           AND tp.elementid IN (34, 38, 109, 110)
          JOIN vpic.element e ON e.id = tp.elementid
          ORDER BY mp.vinschemaid, model_keys, element, trim_keys, trim_value
          LIMIT 1000;
          SQL

      - name: Inspect Civic vehicle-spec schema keys
        run: |
          set -euo pipefail
          CID="${{ job.services.postgres.id }}"
          docker exec -i -e PGPASSWORD=postgres "$CID" \
            psql -U postgres -d trimprobe -v ON_ERROR_STOP=1 <<'SQL'
          WITH target AS (
            SELECT mk.id AS make_id, mo.id AS model_id
            FROM vpic.make_model mm
            JOIN vpic.make mk ON mk.id = mm.makeid
            JOIN vpic.model mo ON mo.id = mm.modelid
            WHERE upper(mk.name) = 'HONDA'
              AND upper(mo.name) = 'CIVIC'
          ), schemas AS (
            SELECT DISTINCT s.id
            FROM vpic.vehiclespecschema s
            JOIN target t ON t.make_id = s.makeid
            JOIN vpic.vehiclespecschema_model sm
              ON sm.vehiclespecschemaid = s.id
             AND sm.modelid = t.model_id
            LEFT JOIN vpic.vehiclespecschema_year sy
              ON sy.vehiclespecschemaid = s.id
            WHERE sy.year = 2009 OR sy.id IS NULL
          )
          SELECT s.id AS schema_id,
                 p.vspecschemapatternid AS pattern_group,
                 p.iskey,
                 e.name AS element,
                 p.attributeid
          FROM schemas s
          JOIN vpic.vspecschemapattern sp ON sp.schemaid = s.id
          JOIN vpic.vehiclespecpattern p ON p.vspecschemapatternid = sp.id
          JOIN vpic.element e ON e.id = p.elementid
          WHERE p.iskey IS TRUE
             OR e.id IN (34, 38, 109, 110)
          ORDER BY schema_id, pattern_group, p.iskey DESC, element, attributeid
          LIMIT 500;
          SQL
