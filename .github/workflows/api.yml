name: API CI/CD

on:
  pull_request:
    paths:
      - 'api/**'
      - 'compose.yaml'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'compose.yaml'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: API build + security + container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: partgraph
          POSTGRES_USER: partgraph
          POSTGRES_PASSWORD: partgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partgraph -d partgraph"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate GitHub Actions supply-chain policy
        run: python3 api/scripts/validate_ci_security.py

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install API dependencies
        run: python -m pip install -e './api[dev]'

      - name: Verify Python dependency integrity
        run: |
          python -m pip check
          python -m pip freeze --all | sort > /tmp/partgraph-python-resolved.txt
          sha256sum /tmp/partgraph-python-resolved.txt

      - name: Audit Python dependencies
        run: pip-audit --skip-editable --progress-spinner off

      - name: Lint API, migrations, and security tests
        run: >-
          ruff check api/partgraph api/migrations
          api/scripts/validate_ci_security.py
          api/scripts/validate_schema_baseline.py
          api/scripts/verify_adopted_baseline.py
          api/scripts/verify_persisted_history_upgrade.py
          api/tests/test_provider_credentials.py
          api/tests/test_operator_preview_bootstrap.py
          api/tests/test_operator_local_bootstrap.py
          api/tests/test_operator_role_management.py
          api/tests/test_rbac_database_privileges.py
          api/tests/test_pipeline_database_privileges.py
          api/tests/test_claim_pipeline_policy.py
          api/tests/test_source_authority_policy_database.py
          api/tests/test_source_authority_enforcement.py
          api/tests/test_capability_database_privileges.py
          api/tests/test_provenance_database_privileges.py
          api/tests/test_auth_origins.py
          api/tests/test_equipment_catalog_seed.py
          api/tests/test_reference_fixture_externalization.py
          api/tests/test_photo_media_security.py

      - name: Test provider credential encryption
        run: python -m unittest discover -s api/tests -p 'test_provider_credentials.py'

      - name: Test preview operator bootstrap guardrails
        run: python -m unittest discover -s api/tests -p 'test_operator_preview_bootstrap.py'

      - name: Test local operator bootstrap guardrails
        run: python -m unittest discover -s api/tests -p 'test_operator_local_bootstrap.py'

      - name: Test operator role management guardrails
        run: python -m unittest discover -s api/tests -p 'test_operator_role_management.py'

      - name: Test authentication origin isolation
        run: python -m unittest discover -s api/tests -p 'test_auth_origins.py'

      - name: Test claim authority policy
        run: python -m unittest discover -s api/tests -p 'test_claim_pipeline_policy.py'

      - name: Test equipment catalog seed
        run: python -m unittest discover -s api/tests -p 'test_equipment_catalog_seed.py'

      - name: Test reference fixture externalization
        run: python -m unittest discover -s api/tests -p 'test_reference_fixture_externalization.py'

      - name: Test repair photo media hardening
        run: python -m unittest discover -s api/tests -p 'test_photo_media_security.py'

      - name: Apply database migrations
        env:
          PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
        run: alembic -c api/alembic.ini upgrade head

      - name: Test database-backed claim authority policy
        env:
          PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
        run: >-
          python -m unittest discover -s api/tests
          -p 'test_source_authority_*.py'

      - name: Build production-copy upgrade SQL
        env:
          PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
        run: |
          mkdir -p /tmp/partgraph-baseline
          EXPECTED_HEAD="$(alembic -c api/alembic.ini heads | awk 'NR == 1 {print $1}')"
          alembic -c api/alembic.ini upgrade 0020_catalog_coverage:head --sql \
            > /tmp/partgraph-baseline/upgrade-0020-to-head.sql
          test -s /tmp/partgraph-baseline/upgrade-0020-to-head.sql
          grep -q "$EXPECTED_HEAD" /tmp/partgraph-baseline/upgrade-0020-to-head.sql

      - name: Test persisted 0020 owner-state upgrade
        env:
          PGPASSWORD: partgraph
        run: |
          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:18.6-alpine \
            psql --host=127.0.0.1 --port=5432 --username=partgraph --dbname=postgres \
              --set=ON_ERROR_STOP=1 --command='CREATE DATABASE partgraph_persisted'
          export PARTGRAPH_DATABASE_URL='postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph_persisted'
          alembic -c api/alembic.ini upgrade 0020_catalog_coverage
          python api/scripts/verify_persisted_history_upgrade.py seed
          EXPECTED_HEAD="$(alembic -c api/alembic.ini heads | awk 'NR == 1 {print $1}')"
          alembic -c api/alembic.ini upgrade head
          python api/scripts/verify_persisted_history_upgrade.py verify \
            --expected-revision "$EXPECTED_HEAD"

      - name: Test legacy stamped 0045 authority-policy repair
        env:
          PGPASSWORD: partgraph
        run: |
          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:18.6-alpine \
            psql --host=127.0.0.1 --port=5432 --username=partgraph --dbname=postgres \
              --set=ON_ERROR_STOP=1 --command='CREATE DATABASE partgraph_legacy_0045'
          export PARTGRAPH_DATABASE_URL='postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph_legacy_0045'
          alembic -c api/alembic.ini upgrade 0045_provenance_conflicts
          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:18.6-alpine \
            psql --host=127.0.0.1 --port=5432 --username=partgraph \
              --dbname=partgraph_legacy_0045 --set=ON_ERROR_STOP=1 \
              --command='DROP TABLE public.source_authority_policies'
          test "$(docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" postgres:18.6-alpine \
            psql --host=127.0.0.1 --port=5432 --username=partgraph --dbname=partgraph_legacy_0045 \
              --tuples-only --no-align --command='SELECT version_num FROM alembic_version')" = '0045_provenance_conflicts'
          alembic -c api/alembic.ini upgrade head
          test "$(docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" postgres:18.6-alpine \
            psql --host=127.0.0.1 --port=5432 --username=partgraph --dbname=partgraph_legacy_0045 \
              --tuples-only --no-align --command="SELECT to_regclass('public.source_authority_policies') IS NOT NULL")" = 't'

      - name: Test database RBAC privilege boundaries
        env:
          PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
        run: python -m unittest discover -s api/tests -p 'test_rbac_database_privileges.py'

      - name: Test Phase 6 pipeline database privileges
        env:
          PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
        run: python -m unittest discover -s api/tests -p 'test_pipeline_database_privileges.py'

      - name: Test capability boundary privileges
        env:
          PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
        run: python -m unittest discover -s api/tests -p 'test_capability_database_privileges.py'

      - name: Test provenance boundary privileges
        env:
          PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
        run: python -m unittest discover -s api/tests -p 'test_provenance_database_privileges.py'

      - name: Build and verify schema-only baseline candidate
        env:
          PGPASSWORD: partgraph
        run: |
          mkdir -p /tmp/partgraph-baseline
          EXPECTED_HEAD="$(alembic -c api/alembic.ini heads | awk 'NR == 1 {print $1}')"
          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:18.6-alpine \
            pg_dump --host=127.0.0.1 --port=5432 --username=partgraph --dbname=partgraph \
              --schema-only --no-owner --no-comments \
            > /tmp/partgraph-baseline/schema.sql
          python api/scripts/validate_schema_baseline.py \
            /tmp/partgraph-baseline/schema.sql "$EXPECTED_HEAD"

          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:18.6-alpine \
            psql --host=127.0.0.1 --port=5432 --username=partgraph --dbname=postgres \
              --set=ON_ERROR_STOP=1 --command='CREATE DATABASE partgraph_baseline'
          cat api/migrations/baseline/roles.sql | docker run --rm -i --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:18.6-alpine \
            psql --host=127.0.0.1 --port=5432 --username=partgraph \
              --dbname=partgraph_baseline --set=ON_ERROR_STOP=1
          cat /tmp/partgraph-baseline/schema.sql | docker run --rm -i --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:18.6-alpine \
            psql --host=127.0.0.1 --port=5432 --username=partgraph \
              --dbname=partgraph_baseline --set=ON_ERROR_STOP=1
          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:18.6-alpine \
            pg_dump --host=127.0.0.1 --port=5432 --username=partgraph \
              --dbname=partgraph_baseline --schema-only --no-owner --no-comments \
            > /tmp/partgraph-baseline/recreated-schema.sql
          python api/scripts/validate_schema_baseline.py \
            /tmp/partgraph-baseline/schema.sql "$EXPECTED_HEAD" \
            /tmp/partgraph-baseline/recreated-schema.sql

      - name: Test adopted 0046 baseline upgrade contract
        env:
          PGPASSWORD: partgraph
        run: |
          mkdir -p /tmp/partgraph-baseline
          EXPECTED_HEAD="$(alembic -c api/alembic.ini heads | awk 'NR == 1 {print $1}')"
          python api/scripts/verify_adopted_baseline.py \
            --output /tmp/partgraph-baseline/adopted-schema.sql
          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:18.6-alpine \
            psql --host=127.0.0.1 --port=5432 --username=partgraph --dbname=postgres \
              --set=ON_ERROR_STOP=1 --command='CREATE DATABASE partgraph_adopted_baseline'
          cat api/migrations/baseline/roles.sql | docker run --rm -i --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:18.6-alpine \
            psql --host=127.0.0.1 --port=5432 --username=partgraph \
              --dbname=partgraph_adopted_baseline --set=ON_ERROR_STOP=1
          cat /tmp/partgraph-baseline/adopted-schema.sql | docker run --rm -i --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:18.6-alpine \
            psql --host=127.0.0.1 --port=5432 --username=partgraph \
              --dbname=partgraph_adopted_baseline --set=ON_ERROR_STOP=1
          cat api/migrations/baseline/stamp.sql | docker run --rm -i --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:18.6-alpine \
            psql --host=127.0.0.1 --port=5432 --username=partgraph \
              --dbname=partgraph_adopted_baseline --set=ON_ERROR_STOP=1
          export PARTGRAPH_DATABASE_URL='postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph_adopted_baseline'
          alembic -c api/alembic.ini upgrade head
          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:18.6-alpine \
            pg_dump --host=127.0.0.1 --port=5432 --username=partgraph \
              --dbname=partgraph_adopted_baseline --schema-only --no-owner --no-comments \
            > /tmp/partgraph-baseline/adopted-upgraded-schema.sql
          python api/scripts/validate_schema_baseline.py \
            /tmp/partgraph-baseline/schema.sql "$EXPECTED_HEAD" \
            /tmp/partgraph-baseline/adopted-upgraded-schema.sql

      - name: Upload schema baseline diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: partgraph-schema-baseline-${{ github.sha }}
          path: |
            /tmp/partgraph-baseline/schema.sql
            /tmp/partgraph-baseline/recreated-schema.sql
            /tmp/partgraph-baseline/adopted-schema.sql
            /tmp/partgraph-baseline/adopted-upgraded-schema.sql
            /tmp/partgraph-baseline/schema-diff.txt
            /tmp/partgraph-baseline/manifest.json
            /tmp/partgraph-baseline/upgrade-0020-to-head.sql
          if-no-files-found: ignore
          retention-days: 7

      - name: Build API container
        run: docker build -t partgraph-api:ci ./api

      - name: Smoke-test running API container
        env:
          PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
        run: |
          docker run -d --name partgraph-api-ci --network host \
            -e PARTGRAPH_DATABASE_URL="$PARTGRAPH_DATABASE_URL" \
            -e PARTGRAPH_WEB_ORIGIN=http://localhost:5173 \
            partgraph-api:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/health/ready; then
              exit 0
            fi
            sleep 1
          done
          docker logs partgraph-api-ci
          exit 1

      - name: Stop API smoke container
        if: always()
        run: docker rm -f partgraph-api-ci >/dev/null 2>&1 || true

  publish:
    name: Publish API image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish API image
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER_LC}/partgraph-api"
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:main" ./api
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:main"
          {
            echo '### PartGraph API delivery'
            echo "- Image: \`$IMAGE:$GITHUB_SHA\`"
            echo "- Rolling tag: \`$IMAGE:main\`"
            echo "- [GHCR package](https://github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/package/partgraph-api)"
          } >> "$GITHUB_STEP_SUMMARY"
