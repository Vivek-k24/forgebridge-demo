name: Validate PartGraph

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: partgraph
          POSTGRES_USER: partgraph
          POSTGRES_PASSWORD: partgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partgraph -d partgraph"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install API dependencies
        run: python -m pip install -e './api[test]'

      - name: Lint API
        run: ruff check api/partgraph api/tests api/migrations

      - name: Apply database migrations
        env:
          PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
        run: alembic -c api/alembic.ini upgrade head

      - name: Test API and PostgreSQL boundary
        env:
          PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
        run: pytest api/tests -q

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Typecheck web
        working-directory: web
        run: npm run typecheck

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Validate Compose model
        run: docker compose config --quiet
