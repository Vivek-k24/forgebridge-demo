name: Integration CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Compose full-stack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build and start PartGraph stack
        run: docker compose up -d --build

      - name: Verify API and Web integration
        run: |
          for attempt in $(seq 1 45); do
            API_OK=0
            WEB_OK=0
            PROXY_OK=0

            curl --fail --silent --show-error \
              http://127.0.0.1:8000/api/v1/health/ready >/dev/null && API_OK=1 || true
            curl --fail --silent --show-error \
              http://127.0.0.1:5173/ >/dev/null && WEB_OK=1 || true
            curl --fail --silent --show-error \
              http://127.0.0.1:5173/api/v1/health/ready >/dev/null && PROXY_OK=1 || true

            if [ "$API_OK" -eq 1 ] && [ "$WEB_OK" -eq 1 ] && [ "$PROXY_OK" -eq 1 ]; then
              echo "PartGraph full stack is healthy."
              exit 0
            fi
            sleep 2
          done

          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Stop PartGraph stack
        if: always()
        run: docker compose down
