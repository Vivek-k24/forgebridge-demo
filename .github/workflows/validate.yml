name: Integration CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Compose full-stack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare ephemeral VIN protection keys
        run: |
          VIN_ENCRYPTION_KEY="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '\n')"
          VIN_LOOKUP_KEY="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '\n')"
          echo "PARTGRAPH_VIN_ENCRYPTION_KEYS={\"1\":\"${VIN_ENCRYPTION_KEY}\"}" >> "$GITHUB_ENV"
          echo "PARTGRAPH_VIN_ACTIVE_KEY_VERSION=1" >> "$GITHUB_ENV"
          echo "PARTGRAPH_VIN_LOOKUP_KEY=${VIN_LOOKUP_KEY}" >> "$GITHUB_ENV"

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build and start PartGraph stack
        run: docker compose up -d --build

      - name: Verify full-stack repair and reorientation integration
        run: |
          for attempt in $(seq 1 45); do
            API_OK=0
            WEB_OK=0
            PROXY_OK=0

            curl --fail --silent --show-error \
              http://127.0.0.1:8000/api/v1/health/ready >/dev/null && API_OK=1 || true
            curl --fail --silent --show-error \
              http://127.0.0.1:5173/ >/dev/null && WEB_OK=1 || true
            curl --fail --silent --show-error \
              http://127.0.0.1:5173/api/v1/health/ready >/dev/null && PROXY_OK=1 || true

            if [ "$API_OK" -eq 1 ] && [ "$WEB_OK" -eq 1 ] && [ "$PROXY_OK" -eq 1 ]; then
              echo "PartGraph full stack is healthy."
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              docker compose ps
              docker compose logs --no-color
              exit 1
            fi
            sleep 2
          done

          USERNAME="ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          EMAIL="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          PASSWORD='PartGraph-ci-password-123!'
          COOKIE_JAR=/tmp/partgraph-ci.cookies
          DEVICE_A=$(python -c 'import uuid; print(uuid.uuid4())')
          DEVICE_B=$(python -c 'import uuid; print(uuid.uuid4())')

          REGISTER=$(curl --fail --silent --show-error \
            -c "$COOKIE_JAR" \
            -H 'Content-Type: application/json' \
            -H 'X-PartGraph-CSRF: 1' \
            --data "{\"email\":\"$EMAIL\",\"username\":\"$USERNAME\",\"password\":\"$PASSWORD\"}" \
            http://127.0.0.1:5173/api/v1/auth/register)
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["user"]["username"] == sys.argv[1]' \
            "$USERNAME" <<< "$REGISTER"

          AUTH_ME=$(curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            http://127.0.0.1:5173/api/v1/auth/me)
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["user"]["username"] == sys.argv[1]' \
            "$USERNAME" <<< "$AUTH_ME"

          MANUAL_VEHICLE=$(curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            -H 'Content-Type: application/json' \
            -H 'X-PartGraph-CSRF: 1' \
            --data '{"nickname":"CI garage car","selection":{"year":2009,"market":"US","make":"Honda","model":"Civic","trim":"Hybrid"}}' \
            http://127.0.0.1:5173/api/v1/user-vehicles/manual)
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["identity_source"] == "manual"; assert p["identity_resolution"] == "manual_candidate"' \
            <<< "$MANUAL_VEHICLE"
          VEHICLE_ID=$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$MANUAL_VEHICLE")

          VEHICLES=$(curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            http://127.0.0.1:5173/api/v1/user-vehicles)
          python -c 'import json,sys; rows=json.load(sys.stdin); assert any(row["id"] == sys.argv[1] for row in rows)' \
            "$VEHICLE_ID" <<< "$VEHICLES"

          VIN_STATUS=$(curl --silent --output /tmp/partgraph-vin-error.json --write-out '%{http_code}' \
            -b "$COOKIE_JAR" \
            -H 'Content-Type: application/json' \
            -H 'X-PartGraph-CSRF: 1' \
            --data '{"market":"US","vin":"1HGCM82643A004352"}' \
            http://127.0.0.1:5173/api/v1/user-vehicles/vin/decode)
          test "$VIN_STATUS" = "422"
          python -c 'import json; p=json.load(open("/tmp/partgraph-vin-error.json")); assert p["error"]["code"] == "VIN_CHECK_DIGIT_INVALID"'

          REPAIR=$(curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            -H 'Content-Type: application/json' \
            -H 'X-PartGraph-CSRF: 1' \
            -H "X-PartGraph-Device-ID: $DEVICE_A" \
            -H 'Idempotency-Key: ci_repair_create_01' \
            --data "{\"user_vehicle_id\":\"$VEHICLE_ID\",\"title\":\"CI radiator repair\"}" \
            http://127.0.0.1:5173/api/v1/repair-sessions)
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["session"]["status"] == "active"; assert p["last_event"]["event_type"] == "session_started"; r=p["reorientation"]; assert r["checkpoint"]["event_type"] == "session_started"; assert r["next_verified_action"]["status"] == "unavailable"; assert r["next_verified_action"]["reason"] == "repair_plan_not_available"' \
            <<< "$REPAIR"
          SESSION_ID=$(python -c 'import json,sys; print(json.load(sys.stdin)["session"]["id"])' <<< "$REPAIR")

          VIEWER_RESUME=$(curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            -H "X-PartGraph-Device-ID: $DEVICE_B" \
            "http://127.0.0.1:5173/api/v1/repair-sessions/$SESSION_ID/resume")
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["lease"]["status"] == "held_by_other"; assert p["lease"]["can_edit"] is False; assert p["reorientation"] is not None' \
            <<< "$VIEWER_RESUME"

          LEASE_STATUS=$(curl --silent --output /tmp/partgraph-lease-error.json --write-out '%{http_code}' \
            -b "$COOKIE_JAR" \
            -X POST \
            -H 'X-PartGraph-CSRF: 1' \
            -H "X-PartGraph-Device-ID: $DEVICE_B" \
            "http://127.0.0.1:5173/api/v1/repair-sessions/$SESSION_ID/lease/acquire")
          test "$LEASE_STATUS" = "409"
          python -c 'import json; p=json.load(open("/tmp/partgraph-lease-error.json")); assert p["error"]["code"] == "REPAIR_SESSION_LEASE_HELD"'

          TAKEOVER=$(curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            -X POST \
            -H 'X-PartGraph-CSRF: 1' \
            -H "X-PartGraph-Device-ID: $DEVICE_B" \
            "http://127.0.0.1:5173/api/v1/repair-sessions/$SESSION_ID/lease/takeover")
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["lease"]["status"] == "owned"' \
            <<< "$TAKEOVER"

          STORAGE=$(curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            -H 'Content-Type: application/json' \
            -H 'X-PartGraph-CSRF: 1' \
            -H "X-PartGraph-Device-ID: $DEVICE_B" \
            -H 'Idempotency-Key: ci_memory_storage_01' \
            --data '{"label":"CI magnetic tray"}' \
            "http://127.0.0.1:5173/api/v1/repair-sessions/$SESSION_ID/storage-locations")
          STORAGE_ID=$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$STORAGE")

          FASTENER=$(curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            -H 'Content-Type: application/json' \
            -H 'X-PartGraph-CSRF: 1' \
            -H "X-PartGraph-Device-ID: $DEVICE_B" \
            -H 'Idempotency-Key: ci_memory_fastener_01' \
            --data "{\"label\":\"CI upper support bolt\",\"origin\":\"radiator support\",\"position\":\"driver side\",\"physical_state\":\"stored\",\"storage_location_id\":\"$STORAGE_ID\"}" \
            "http://127.0.0.1:5173/api/v1/repair-sessions/$SESSION_ID/fasteners")
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["physical_state"] == "stored"' \
            <<< "$FASTENER"
          FASTENER_ID=$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$FASTENER")

          INVENTORY=$(curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            -H 'Content-Type: application/json' \
            -H 'X-PartGraph-CSRF: 1' \
            -H "X-PartGraph-Device-ID: $DEVICE_B" \
            -H 'Idempotency-Key: ci_memory_inventory_01' \
            --data '{"name":"CI replacement bolt","quantity":1,"procurement_state":"needed"}' \
            "http://127.0.0.1:5173/api/v1/repair-sessions/$SESSION_ID/inventory")
          INVENTORY_ID=$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$INVENTORY")

          INVENTORY_AVAILABLE=$(curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            -X PATCH \
            -H 'Content-Type: application/json' \
            -H 'X-PartGraph-CSRF: 1' \
            -H "X-PartGraph-Device-ID: $DEVICE_B" \
            -H 'Idempotency-Key: ci_memory_inventory_02' \
            --data '{"procurement_state":"available","quantity":1}' \
            "http://127.0.0.1:5173/api/v1/repair-sessions/$SESSION_ID/inventory/$INVENTORY_ID")
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["procurement_state"] == "available"' \
            <<< "$INVENTORY_AVAILABLE"

          OBSERVATION=$(curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            -H 'Content-Type: application/json' \
            -H 'X-PartGraph-CSRF: 1' \
            -H "X-PartGraph-Device-ID: $DEVICE_B" \
            -H 'Idempotency-Key: ci_memory_observation_01' \
            --data "{\"category\":\"condition\",\"text\":\"CI threads appear reusable.\",\"fastener_id\":\"$FASTENER_ID\"}" \
            "http://127.0.0.1:5173/api/v1/repair-sessions/$SESSION_ID/observations")
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["source"] == "user"; assert p["review_state"] == "confirmed"' \
            <<< "$OBSERVATION"
          OBSERVATION_ID=$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$OBSERVATION")

          printf '\x89PNG\r\n\x1a\nPartGraph-CI' > /tmp/partgraph-ci.png
          PHOTO=$(curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            -H 'X-PartGraph-CSRF: 1' \
            -H "X-PartGraph-Device-ID: $DEVICE_B" \
            -H 'Idempotency-Key: ci_memory_photo_01' \
            -F 'purpose=fastener' \
            -F "fastener_id=$FASTENER_ID" \
            -F "observation_id=$OBSERVATION_ID" \
            -F 'photo=@/tmp/partgraph-ci.png;type=image/png' \
            "http://127.0.0.1:5173/api/v1/repair-sessions/$SESSION_ID/photos")
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["purpose"] == "fastener"' \
            <<< "$PHOTO"
          PHOTO_ID=$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$PHOTO")

          curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            "http://127.0.0.1:5173/api/v1/repair-sessions/$SESSION_ID/photos/$PHOTO_ID/content" \
            --output /tmp/partgraph-ci-downloaded.png
          cmp /tmp/partgraph-ci.png /tmp/partgraph-ci-downloaded.png

          MEMORY_RESUME=$(curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            -H "X-PartGraph-Device-ID: $DEVICE_B" \
            "http://127.0.0.1:5173/api/v1/repair-sessions/$SESSION_ID/resume")
          python -c 'import json,sys; p=json.load(sys.stdin); r=p["reorientation"]; assert p["last_event"]["event_type"] == "photo_evidence_added"; assert r["checkpoint"]["event_type"] == "photo_evidence_added"; assert r["counts"]["fasteners_total"] == 1; assert r["counts"]["hardware_stored"] == 1; assert r["counts"]["procurement_blockers"] == 0; assert r["storage_groups"][0]["label"] == "CI magnetic tray"; assert any(item["id"] == sys.argv[1] for item in r["recent_evidence"]); assert r["attention"] == []' \
            "$PHOTO_ID" <<< "$MEMORY_RESUME"

          PHOTO_DELETE=$(curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            -X DELETE \
            -H 'X-PartGraph-CSRF: 1' \
            -H "X-PartGraph-Device-ID: $DEVICE_B" \
            -H 'Idempotency-Key: ci_memory_photo_delete_01' \
            "http://127.0.0.1:5173/api/v1/repair-sessions/$SESSION_ID/photos/$PHOTO_ID")
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["id"] == sys.argv[1]' \
            "$PHOTO_ID" <<< "$PHOTO_DELETE"

          PHOTO_STATUS=$(curl --silent --output /tmp/partgraph-photo-error.json --write-out '%{http_code}' \
            -b "$COOKIE_JAR" \
            "http://127.0.0.1:5173/api/v1/repair-sessions/$SESSION_ID/photos/$PHOTO_ID/content")
          test "$PHOTO_STATUS" = "404"
          python -c 'import json; p=json.load(open("/tmp/partgraph-photo-error.json")); assert p["error"]["code"] == "PHOTO_EVIDENCE_NOT_FOUND"'

          PAUSED=$(curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            -X POST \
            -H 'X-PartGraph-CSRF: 1' \
            -H "X-PartGraph-Device-ID: $DEVICE_B" \
            -H 'Idempotency-Key: ci_repair_pause_01' \
            "http://127.0.0.1:5173/api/v1/repair-sessions/$SESSION_ID/pause")
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["event"]["event_type"] == "session_paused"; assert p["session"]["status"] == "paused"' \
            <<< "$PAUSED"

          PAUSED_SNAPSHOT=$(curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            -H "X-PartGraph-Device-ID: $DEVICE_B" \
            "http://127.0.0.1:5173/api/v1/repair-sessions/$SESSION_ID/resume")
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["last_event"]["event_type"] == "session_paused"; assert p["session"]["status"] == "paused"; assert p["reorientation"]["next_verified_action"]["reason"] == "repair_plan_not_available"' \
            <<< "$PAUSED_SNAPSHOT"

          RESUMED=$(curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            -X POST \
            -H 'X-PartGraph-CSRF: 1' \
            -H "X-PartGraph-Device-ID: $DEVICE_B" \
            -H 'Idempotency-Key: ci_repair_resume_01' \
            "http://127.0.0.1:5173/api/v1/repair-sessions/$SESSION_ID/resume")
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["event"]["event_type"] == "session_resumed"; assert p["session"]["status"] == "active"' \
            <<< "$RESUMED"

          HISTORY=$(curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            "http://127.0.0.1:5173/api/v1/repair-sessions/$SESSION_ID/events?after_sequence=0&limit=50")
          python -c 'import json,sys; p=json.load(sys.stdin); kinds={item["event_type"] for item in p["items"]}; required={"session_started","storage_location_created","fastener_recorded","inventory_item_recorded","inventory_state_changed","observation_recorded","photo_evidence_added","photo_evidence_deleted","session_paused","session_resumed"}; assert required <= kinds' \
            <<< "$HISTORY"

          ARCHIVED=$(curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            -X PATCH \
            -H 'X-PartGraph-CSRF: 1' \
            -H "X-PartGraph-Device-ID: $DEVICE_B" \
            -H 'Idempotency-Key: ci_repair_archive_01' \
            "http://127.0.0.1:5173/api/v1/repair-sessions/$SESSION_ID/archive")
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["event"]["event_type"] == "session_archived"; assert p["session"]["status"] == "archived"' \
            <<< "$ARCHIVED"

          ACTIVE_SESSIONS=$(curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            http://127.0.0.1:5173/api/v1/repair-sessions)
          python -c 'import json,sys; rows=json.load(sys.stdin); assert all(row["id"] != sys.argv[1] for row in rows)' \
            "$SESSION_ID" <<< "$ACTIVE_SESSIONS"

          ALL_SESSIONS=$(curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            'http://127.0.0.1:5173/api/v1/repair-sessions?include_archived=true')
          python -c 'import json,sys; rows=json.load(sys.stdin); assert any(row["id"] == sys.argv[1] for row in rows)' \
            "$SESSION_ID" <<< "$ALL_SESSIONS"

          ARCHIVED_VEHICLE=$(curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            -X PATCH \
            -H 'X-PartGraph-CSRF: 1' \
            "http://127.0.0.1:5173/api/v1/user-vehicles/$VEHICLE_ID/archive")
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["archived_at"] is not None' \
            <<< "$ARCHIVED_VEHICLE"

          ACTIVE_VEHICLES=$(curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            http://127.0.0.1:5173/api/v1/user-vehicles)
          python -c 'import json,sys; rows=json.load(sys.stdin); assert all(row["id"] != sys.argv[1] for row in rows)' \
            "$VEHICLE_ID" <<< "$ACTIVE_VEHICLES"

          ALL_VEHICLES=$(curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            'http://127.0.0.1:5173/api/v1/user-vehicles?include_archived=true')
          python -c 'import json,sys; rows=json.load(sys.stdin); assert any(row["id"] == sys.argv[1] for row in rows)' \
            "$VEHICLE_ID" <<< "$ALL_VEHICLES"

          curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            -c "$COOKIE_JAR" \
            -X POST \
            -H 'X-PartGraph-CSRF: 1' \
            http://127.0.0.1:5173/api/v1/auth/logout >/dev/null

          LOGIN=$(curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            -c "$COOKIE_JAR" \
            -H 'Content-Type: application/json' \
            -H 'X-PartGraph-CSRF: 1' \
            --data "{\"identifier\":\"$USERNAME\",\"password\":\"$PASSWORD\"}" \
            http://127.0.0.1:5173/api/v1/auth/login)
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["user"]["username"] == sys.argv[1]' \
            "$USERNAME" <<< "$LOGIN"

          CSRF_STATUS=$(curl --silent --output /tmp/partgraph-csrf-error.json --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data "{\"identifier\":\"$USERNAME\",\"password\":\"$PASSWORD\"}" \
            http://127.0.0.1:5173/api/v1/auth/login)
          test "$CSRF_STATUS" = "403"
          python -c 'import json; p=json.load(open("/tmp/partgraph-csrf-error.json")); assert p["error"]["code"] == "AUTH_CSRF_FAILED"'

      - name: Stop PartGraph stack
        if: always()
        run: docker compose down
