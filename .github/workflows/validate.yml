name: Integration CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Compose full-stack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare ephemeral VIN protection keys
        run: |
          VIN_ENCRYPTION_KEY="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '\n')"
          VIN_LOOKUP_KEY="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '\n')"
          echo "PARTGRAPH_VIN_ENCRYPTION_KEYS={\"1\":\"${VIN_ENCRYPTION_KEY}\"}" >> "$GITHUB_ENV"
          echo "PARTGRAPH_VIN_ACTIVE_KEY_VERSION=1" >> "$GITHUB_ENV"
          echo "PARTGRAPH_VIN_LOOKUP_KEY=${VIN_LOOKUP_KEY}" >> "$GITHUB_ENV"

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build and start PartGraph stack
        run: docker compose up -d --build

      - name: Verify API, Web, auth, and private vehicle integration
        run: |
          for attempt in $(seq 1 45); do
            API_OK=0
            WEB_OK=0
            PROXY_OK=0

            curl --fail --silent --show-error \
              http://127.0.0.1:8000/api/v1/health/ready >/dev/null && API_OK=1 || true
            curl --fail --silent --show-error \
              http://127.0.0.1:5173/ >/dev/null && WEB_OK=1 || true
            curl --fail --silent --show-error \
              http://127.0.0.1:5173/api/v1/health/ready >/dev/null && PROXY_OK=1 || true

            if [ "$API_OK" -eq 1 ] && [ "$WEB_OK" -eq 1 ] && [ "$PROXY_OK" -eq 1 ]; then
              echo "PartGraph full stack is healthy."
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              docker compose ps
              docker compose logs --no-color
              exit 1
            fi
            sleep 2
          done

          USERNAME="ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          EMAIL="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          PASSWORD='PartGraph-ci-password-123!'
          COOKIE_JAR=/tmp/partgraph-ci.cookies

          curl --fail --silent --show-error \
            -c "$COOKIE_JAR" \
            -H 'Content-Type: application/json' \
            -H 'X-PartGraph-CSRF: 1' \
            --data "{\"email\":\"$EMAIL\",\"username\":\"$USERNAME\",\"password\":\"$PASSWORD\"}" \
            http://127.0.0.1:5173/api/v1/auth/register \
            | grep -q "\"username\":\"$USERNAME\""

          curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            http://127.0.0.1:5173/api/v1/auth/me \
            | grep -q "\"username\":\"$USERNAME\""

          MANUAL_VEHICLE=$(curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            -H 'Content-Type: application/json' \
            -H 'X-PartGraph-CSRF: 1' \
            --data '{"nickname":"CI garage car","selection":{"year":2009,"market":"US","make":"Honda","model":"Civic","trim":"Hybrid"}}' \
            http://127.0.0.1:5173/api/v1/user-vehicles/manual)
          echo "$MANUAL_VEHICLE" | grep -q '"identity_source":"manual"'
          echo "$MANUAL_VEHICLE" | grep -q '"identity_resolution":"manual_candidate"'
          VEHICLE_ID=$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$MANUAL_VEHICLE")

          curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            http://127.0.0.1:5173/api/v1/user-vehicles \
            | grep -q "\"id\":\"$VEHICLE_ID\""

          VIN_STATUS=$(curl --silent --output /tmp/partgraph-vin-error.json --write-out '%{http_code}' \
            -b "$COOKIE_JAR" \
            -H 'Content-Type: application/json' \
            -H 'X-PartGraph-CSRF: 1' \
            --data '{"market":"US","vin":"1HGCM82643A004352"}' \
            http://127.0.0.1:5173/api/v1/user-vehicles/vin/decode)
          test "$VIN_STATUS" = "422"
          grep -q 'VIN_CHECK_DIGIT_INVALID' /tmp/partgraph-vin-error.json

          curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            -X PATCH \
            -H 'X-PartGraph-CSRF: 1' \
            "http://127.0.0.1:5173/api/v1/user-vehicles/$VEHICLE_ID/archive" \
            | grep -q '"archived_at"'

          if curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            http://127.0.0.1:5173/api/v1/user-vehicles \
            | grep -q "\"id\":\"$VEHICLE_ID\""; then
            echo "Archived vehicle leaked into the default active list."
            exit 1
          fi

          curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            'http://127.0.0.1:5173/api/v1/user-vehicles?include_archived=true' \
            | grep -q "\"id\":\"$VEHICLE_ID\""

          curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            -c "$COOKIE_JAR" \
            -X POST \
            -H 'X-PartGraph-CSRF: 1' \
            http://127.0.0.1:5173/api/v1/auth/logout >/dev/null

          curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            -c "$COOKIE_JAR" \
            -H 'Content-Type: application/json' \
            -H 'X-PartGraph-CSRF: 1' \
            --data "{\"identifier\":\"$USERNAME\",\"password\":\"$PASSWORD\"}" \
            http://127.0.0.1:5173/api/v1/auth/login \
            | grep -q "\"username\":\"$USERNAME\""

          CSRF_STATUS=$(curl --silent --output /tmp/partgraph-csrf-error.json --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data "{\"identifier\":\"$USERNAME\",\"password\":\"$PASSWORD\"}" \
            http://127.0.0.1:5173/api/v1/auth/login)
          test "$CSRF_STATUS" = "403"
          grep -q 'AUTH_CSRF_FAILED' /tmp/partgraph-csrf-error.json

      - name: Stop PartGraph stack
        if: always()
        run: docker compose down
