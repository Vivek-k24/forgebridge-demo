name: Canonical Publication CI

on:
  pull_request:
    paths:
      - 'api/data/reference/persistent_publication_plan_v1.json'
      - 'docs/CANONICAL_PUBLICATION_RUNBOOK.md'
      - 'api/partgraph/knowledge/canonical_claim_materialization.py'
      - 'api/partgraph/knowledge/part_catalog_materialization.py'
      - 'api/partgraph/knowledge/downstream_materialization.py'
      - 'api/partgraph/knowledge/vehicle_domain_materialization.py'
      - 'api/partgraph/knowledge/repair_materialization.py'
      - 'api/partgraph/knowledge/repair_materialization_contract.py'
      - 'api/partgraph/knowledge/repair_materialization_service.py'
      - 'api/partgraph/knowledge/claim_publication.py'
      - 'api/partgraph/knowledge/conflict_resolution.py'
      - 'api/partgraph/knowledge/source_policy.py'
      - 'api/partgraph/knowledge/provenance.py'
      - 'api/partgraph/identity/auth/roles.py'
      - 'api/tests/test_persistent_publication_plan.py'
      - 'api/tests/test_canonical_claim_materialization_database.py'
      - 'api/tests/test_vehicle_domain_materialization_database.py'
      - 'api/tests/test_vehicle_domain_materializer_database_privileges.py'
      - 'api/tests/test_downstream_materialization_database.py'
      - 'api/tests/test_downstream_materializer_database_privileges.py'
      - 'api/tests/test_materializer_database_privileges.py'
      - 'api/tests/test_part_catalog_materialization_database.py'
      - 'api/tests/test_part_catalog_materializer_database_privileges.py'
      - 'api/tests/test_repair_materialization_database.py'
      - 'api/tests/test_repair_materialization_policy.py'
      - 'api/tests/test_claim_pipeline_policy.py'
      - 'api/migrations/**'
      - 'api/pyproject.toml'
      - '.github/workflows/publication.yml'
  push:
    branches:
      - main
      - partgraph-mvp-consolidation
    paths:
      - 'api/data/reference/persistent_publication_plan_v1.json'
      - 'docs/CANONICAL_PUBLICATION_RUNBOOK.md'
      - 'api/partgraph/knowledge/canonical_claim_materialization.py'
      - 'api/partgraph/knowledge/part_catalog_materialization.py'
      - 'api/partgraph/knowledge/downstream_materialization.py'
      - 'api/partgraph/knowledge/vehicle_domain_materialization.py'
      - 'api/partgraph/knowledge/repair_materialization.py'
      - 'api/partgraph/knowledge/repair_materialization_contract.py'
      - 'api/partgraph/knowledge/repair_materialization_service.py'
      - 'api/partgraph/knowledge/claim_publication.py'
      - 'api/partgraph/knowledge/conflict_resolution.py'
      - 'api/partgraph/knowledge/source_policy.py'
      - 'api/partgraph/knowledge/provenance.py'
      - 'api/partgraph/identity/auth/roles.py'
      - 'api/tests/test_persistent_publication_plan.py'
      - 'api/tests/test_canonical_claim_materialization_database.py'
      - 'api/tests/test_vehicle_domain_materialization_database.py'
      - 'api/tests/test_vehicle_domain_materializer_database_privileges.py'
      - 'api/tests/test_downstream_materialization_database.py'
      - 'api/tests/test_downstream_materializer_database_privileges.py'
      - 'api/tests/test_materializer_database_privileges.py'
      - 'api/tests/test_part_catalog_materialization_database.py'
      - 'api/tests/test_part_catalog_materializer_database_privileges.py'
      - 'api/tests/test_repair_materialization_database.py'
      - 'api/tests/test_repair_materialization_policy.py'
      - 'api/tests/test_claim_pipeline_policy.py'
      - 'api/migrations/**'
      - 'api/pyproject.toml'
      - '.github/workflows/publication.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication:
    name: Verified claim + canonical materialization gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: partgraph
          POSTGRES_USER: partgraph
          POSTGRES_PASSWORD: partgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partgraph -d partgraph"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install API dependencies
        run: python -m pip install -e './api[dev]'

      - name: Lint canonical publication boundary
        run: >-
          ruff check
          api/partgraph/knowledge/canonical_claim_materialization.py
          api/partgraph/knowledge/part_catalog_materialization.py
          api/partgraph/knowledge/downstream_materialization.py
          api/partgraph/knowledge/vehicle_domain_materialization.py
          api/partgraph/knowledge/repair_materialization.py
          api/partgraph/knowledge/repair_materialization_contract.py
          api/partgraph/knowledge/repair_materialization_service.py
          api/partgraph/knowledge/claim_publication.py
          api/partgraph/knowledge/conflict_resolution.py
          api/partgraph/knowledge/source_policy.py
          api/partgraph/knowledge/provenance.py
          api/partgraph/identity/auth/roles.py
          api/migrations/versions/0053_domain_materialization.py
          api/migrations/versions/0054_vehicle_verify_timestamp.py
          api/migrations/versions/0055_part_catalog.py
          api/migrations/versions/0058_downstream_materializer.py
          api/migrations/versions/0059_primary_vehicle_domains.py
          api/tests/test_persistent_publication_plan.py
          api/tests/test_canonical_claim_materialization_database.py
          api/tests/test_vehicle_domain_materialization_database.py
          api/tests/test_vehicle_domain_materializer_database_privileges.py
          api/tests/test_downstream_materialization_database.py
          api/tests/test_downstream_materializer_database_privileges.py
          api/tests/test_materializer_database_privileges.py
          api/tests/test_part_catalog_materialization_database.py
          api/tests/test_part_catalog_materializer_database_privileges.py
          api/tests/test_repair_materialization_database.py
          api/tests/test_repair_materialization_policy.py
          api/tests/test_claim_pipeline_policy.py

      - name: Apply database migrations
        env:
          PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
        run: alembic -c api/alembic.ini upgrade head

      - name: Test persistent publication contract
        run: >-
          python -m unittest discover -s api/tests
          -p 'test_persistent_publication_plan.py'

      - name: Test claim and repair publication policy
        run: >-
          python -m unittest discover -s api/tests
          -p 'test_claim_pipeline_policy.py'

      - name: Test materializer database privileges
        env:
          PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
        run: python -m unittest discover -s api/tests -p 'test_materializer_database_privileges.py'

      - name: Test downstream materializer database privileges
        env:
          PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
        run: >-
          python -m unittest discover -s api/tests
          -p 'test_downstream_materializer_database_privileges.py'

      - name: Test downstream materialization
        env:
          PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
        run: >-
          python -m unittest discover -s api/tests
          -p 'test_downstream_materialization_database.py'

      - name: Test vehicle domain materializer privileges
        env:
          PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
        run: >-
          python -m unittest discover -s api/tests
          -p 'test_vehicle_domain_materializer_database_privileges.py'

      - name: Test vehicle structure and specification materialization
        env:
          PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
        run: >-
          python -m unittest discover -s api/tests
          -p 'test_vehicle_domain_materialization_database.py'

      - name: Test part catalog materializer privileges
        env:
          PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
        run: >-
          python -m unittest discover -s api/tests
          -p 'test_part_catalog_materializer_database_privileges.py'

      - name: Test part catalog identity materialization
        env:
          PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
        run: >-
          python -m unittest discover -s api/tests
          -p 'test_part_catalog_materialization_database.py'

      - name: Test vehicle identity and part fitment materialization
        env:
          PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
        run: >-
          python -m unittest discover -s api/tests
          -p 'test_canonical_claim_materialization_database.py'

      - name: Test repair materialization policy
        run: python -m unittest discover -s api/tests -p 'test_repair_materialization_policy.py'

      - name: Test repair materialization database integration
        env:
          PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
        run: python -m unittest discover -s api/tests -p 'test_repair_materialization_database.py'
