name: MVP Final Validation CI

on:
  pull_request:
  push:
    branches:
      - main
      - partgraph-mvp-consolidation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvp-final-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-domain:
    name: Phase 9 unit/domain contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install API dependencies
        run: python -m pip install -e './api[dev]'

      - name: Lint Phase 9 unit/domain boundary
        run: >-
          ruff check
          api/partgraph/knowledge/source_policy.py
          api/partgraph/knowledge/provider_network.py
          api/partgraph/knowledge/repair_materialization_contract.py
          api/partgraph/knowledge/support_boundaries.py
          api/partgraph/repair_experience/recovery.py
          api/tests/test_claim_pipeline_policy.py
          api/tests/test_repair_materialization_policy.py
          api/tests/test_provider_network_policy.py
          api/tests/test_provider_timeout_hierarchy.py
          api/tests/test_database_write_recovery.py
          api/tests/test_reference_fixture_externalization.py

      - name: Run final-MVP unit/domain contracts
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            test_claim_pipeline_policy.py
            test_repair_materialization_policy.py
            test_provider_network_policy.py
            test_provider_timeout_hierarchy.py
            test_database_write_recovery.py
            test_reference_fixture_externalization.py
          )
          for test_file in "${tests[@]}"; do
            echo "=== ${test_file} ==="
            python -m unittest discover -s api/tests -p "${test_file}" -v
          done

  api-contracts:
    name: Phase 9 API contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: partgraph
          POSTGRES_USER: partgraph
          POSTGRES_PASSWORD: partgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partgraph -d partgraph"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install API dependencies
        run: python -m pip install -e './api[dev]'

      - name: Lint Phase 9 API boundary
        run: >-
          ruff check
          api/partgraph/main.py
          api/partgraph/identity/user_vehicle/router.py
          api/partgraph/repair_experience/router.py
          api/partgraph/repair_experience/readiness.py
          api/partgraph/repair_experience/guidance.py
          api/partgraph/repair_experience/completion.py
          api/tests/test_mvp_api_contracts.py

      - name: Apply database migrations
        env:
          PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
        run: alembic -c api/alembic.ini upgrade head

      - name: Run final-MVP API contracts
        env:
          PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
        run: >-
          python -m unittest discover -s api/tests
          -p 'test_mvp_api_contracts.py' -v

  auth-security:
    name: Phase 9 authentication/security contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
      PARTGRAPH_WEB_ORIGIN: https://partgraph.test
      PARTGRAPH_COOKIE_SECURE: 'true'
      PARTGRAPH_AUTH_RATE_LIMIT_ATTEMPTS: '3'
      PARTGRAPH_AUTH_RATE_LIMIT_MINUTES: '1'

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: partgraph
          POSTGRES_USER: partgraph
          POSTGRES_PASSWORD: partgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partgraph -d partgraph"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install API dependencies
        run: python -m pip install -e './api[dev]'

      - name: Lint Phase 9 authentication security boundary
        run: >-
          ruff check
          api/partgraph/config.py
          api/partgraph/identity/auth/dependencies.py
          api/partgraph/identity/auth/models.py
          api/partgraph/identity/auth/router.py
          api/partgraph/identity/auth/schemas.py
          api/partgraph/identity/auth/service.py
          api/tests/test_auth_origins.py
          api/tests/test_mvp_auth_security.py

      - name: Apply database migrations
        run: alembic -c api/alembic.ini upgrade head

      - name: Run final-MVP authentication security contracts
        run: >-
          python -m unittest discover -s api/tests
          -p 'test_mvp_auth_security.py' -v

      - name: Re-run exact-origin and CSP contracts
        run: >-
          python -m unittest discover -s api/tests
          -p 'test_auth_origins.py' -v

  owner-isolation:
    name: Phase 9 RLS/owner-isolation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: partgraph
          POSTGRES_USER: partgraph
          POSTGRES_PASSWORD: partgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partgraph -d partgraph"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install API dependencies
        run: python -m pip install -e './api[dev]'

      - name: Lint Phase 9 owner-isolation boundary
        run: >-
          ruff check
          api/partgraph/identity/auth/dependencies.py
          api/tests/test_mvp_owner_isolation.py

      - name: Apply database migrations
        run: alembic -c api/alembic.ini upgrade head

      - name: Run final-MVP RLS and owner-isolation contracts
        run: >-
          python -m unittest discover -s api/tests
          -p 'test_mvp_owner_isolation.py' -v


  migrations:
    name: Phase 9 migration contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: partgraph
          POSTGRES_USER: partgraph
          POSTGRES_PASSWORD: partgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partgraph -d partgraph"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install API dependencies
        run: python -m pip install -e './api[dev]'

      - name: Lint Phase 9 migration boundary
        run: ruff check api/migrations api/tests/test_mvp_migrations.py

      - name: Run static migration-history contracts
        run: >-
          python -m unittest
          api.tests.test_mvp_migrations.FinalMvpMigrationTests.test_revision_graph_has_one_linear_head_and_one_base
          api.tests.test_mvp_migrations.FinalMvpMigrationTests.test_every_parent_revision_is_present
          -v

      - name: Apply complete migration history to fresh database
        run: alembic -c api/alembic.ini upgrade head

      - name: Run migrated-database contracts
        run: >-
          python -m unittest discover -s api/tests
          -p 'test_mvp_migrations.py' -v

      - name: Re-apply head idempotently
        run: |
          alembic -c api/alembic.ini upgrade head
          test "$(alembic -c api/alembic.ini current | awk 'NR == 1 {print $1}')" = "$(alembic -c api/alembic.ini heads | awk 'NR == 1 {print $1}')"


  production-copy-migration:
    name: Phase 9 production-copy migration contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: partgraph
          POSTGRES_USER: partgraph
          POSTGRES_PASSWORD: partgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partgraph -d partgraph"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install API dependencies
        run: python -m pip install -e './api[dev]'

      - name: Lint Phase 9 production-copy boundary
        run: >-
          ruff check
          api/scripts/verify_persisted_history_upgrade.py
          api/scripts/verify_production_copy_upgrade.py

      - name: Build production-era schema at 0020
        run: alembic -c api/alembic.ini upgrade 0020_catalog_coverage

      - name: Seed representative persisted owner state
        run: python api/scripts/verify_persisted_history_upgrade.py seed

      - name: Fingerprint production-era owner state
        run: >-
          python api/scripts/verify_production_copy_upgrade.py snapshot
          --snapshot /tmp/phase9-production-copy.json

      - name: Upgrade production-era copy to current head
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_HEAD="$(alembic -c api/alembic.ini heads | awk 'NR == 1 {print $1}')"
          alembic -c api/alembic.ini upgrade head
          python api/scripts/verify_persisted_history_upgrade.py verify             --expected-revision "$EXPECTED_HEAD"
          python api/scripts/verify_production_copy_upgrade.py verify             --snapshot /tmp/phase9-production-copy.json             --expected-revision "$EXPECTED_HEAD"

      - name: Upload owner-state fingerprint diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: phase9-production-copy-fingerprint-${{ github.sha }}
          path: /tmp/phase9-production-copy.json
          if-no-files-found: ignore
          retention-days: 7


  full-stack:
    name: Phase 9 full-stack integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
      PARTGRAPH_WEB_ORIGIN: http://127.0.0.1:8000
      PARTGRAPH_COOKIE_SECURE: 'false'
      PARTGRAPH_FULL_STACK_URL: http://127.0.0.1:8000
      PARTGRAPH_MEDIA_ROOT: /tmp/partgraph-phase9-media

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: partgraph
          POSTGRES_USER: partgraph
          POSTGRES_PASSWORD: partgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partgraph -d partgraph"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install API dependencies
        run: python -m pip install -e './api[dev]'

      - name: Install locked web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Lint full-stack verifier
        run: ruff check api/scripts/verify_full_stack_runtime.py

      - name: Build same-origin frontend bundle
        working-directory: web
        env:
          VITE_API_BASE_URL: ''
        run: npm run build

      - name: Package frontend into API runtime
        run: |
          rm -rf api/partgraph/frontend
          mkdir -p api/partgraph/frontend
          cp -R web/dist/. api/partgraph/frontend/

      - name: Apply database migrations
        run: alembic -c api/alembic.ini upgrade head

      - name: Start assembled PartGraph stack
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn partgraph.main:app \
            --app-dir api \
            --host 127.0.0.1 \
            --port 8000 \
            > /tmp/partgraph-phase9-full-stack.log 2>&1 &
          echo "$!" > /tmp/partgraph-phase9-full-stack.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
                http://127.0.0.1:8000/api/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/partgraph-phase9-full-stack.log
          exit 1

      - name: Run final-MVP full-stack integration
        run: python api/scripts/verify_full_stack_runtime.py

      - name: Stop assembled PartGraph stack
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/partgraph-phase9-full-stack.pid ]; then
            kill "$(cat /tmp/partgraph-phase9-full-stack.pid)" >/dev/null 2>&1 || true
          fi
          if [ -f /tmp/partgraph-phase9-full-stack.log ]; then
            cat /tmp/partgraph-phase9-full-stack.log
          fi


  verified-guidance:
    name: Phase 9 verified-guidance integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
      PARTGRAPH_WEB_ORIGIN: http://127.0.0.1:8000
      PARTGRAPH_COOKIE_SECURE: 'false'
      PARTGRAPH_VERIFIED_GUIDANCE_URL: http://127.0.0.1:8000
      PARTGRAPH_MEDIA_ROOT: /tmp/partgraph-phase9-guidance-media

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: partgraph
          POSTGRES_USER: partgraph
          POSTGRES_PASSWORD: partgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partgraph -d partgraph"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install API dependencies
        run: python -m pip install -e './api[dev]'

      - name: Lint verified-guidance verifier
        run: ruff check api/scripts/verify_verified_guidance_integration.py

      - name: Apply database migrations
        run: alembic -c api/alembic.ini upgrade head

      - name: Seed reviewed evidence and materialize verified repair
        run: python api/scripts/verify_verified_guidance_integration.py seed

      - name: Start PartGraph API
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn partgraph.main:app \
            --app-dir api \
            --host 127.0.0.1 \
            --port 8000 \
            > /tmp/partgraph-phase9-guidance.log 2>&1 &
          echo "$!" > /tmp/partgraph-phase9-guidance.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
                http://127.0.0.1:8000/api/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/partgraph-phase9-guidance.log
          exit 1

      - name: Run verified-guidance integration
        run: python api/scripts/verify_verified_guidance_integration.py verify

      - name: Stop PartGraph API
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/partgraph-phase9-guidance.pid ]; then
            kill "$(cat /tmp/partgraph-phase9-guidance.pid)" >/dev/null 2>&1 || true
          fi
          if [ -f /tmp/partgraph-phase9-guidance.log ]; then
            cat /tmp/partgraph-phase9-guidance.log
          fi


  browser-e2e:
    name: Phase 9 browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
      PARTGRAPH_WEB_ORIGIN: http://127.0.0.1:8000
      PARTGRAPH_COOKIE_SECURE: 'false'
      PARTGRAPH_BROWSER_E2E_URL: http://127.0.0.1:8000
      PARTGRAPH_MEDIA_ROOT: /tmp/partgraph-phase9-browser-media

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: partgraph
          POSTGRES_USER: partgraph
          POSTGRES_PASSWORD: partgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partgraph -d partgraph"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install API dependencies
        run: python -m pip install -e './api[dev]'

      - name: Install pinned browser runtime
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium

      - name: Install locked web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Lint browser E2E verifier
        run: ruff check api/scripts/verify_browser_e2e.py

      - name: Build same-origin frontend bundle
        working-directory: web
        env:
          VITE_API_BASE_URL: ''
        run: npm run build

      - name: Package frontend into API runtime
        run: |
          rm -rf api/partgraph/frontend
          mkdir -p api/partgraph/frontend
          cp -R web/dist/. api/partgraph/frontend/

      - name: Apply database migrations
        run: alembic -c api/alembic.ini upgrade head

      - name: Start assembled PartGraph stack
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn partgraph.main:app \
            --app-dir api \
            --host 127.0.0.1 \
            --port 8000 \
            > /tmp/partgraph-phase9-browser.log 2>&1 &
          echo "$!" > /tmp/partgraph-phase9-browser.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
                http://127.0.0.1:8000/api/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/partgraph-phase9-browser.log
          exit 1

      - name: Run real Chromium browser E2E
        run: python api/scripts/verify_browser_e2e.py

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: phase9-browser-e2e-${{ github.sha }}
          path: /tmp/partgraph-phase9-browser.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop assembled PartGraph stack
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/partgraph-phase9-browser.pid ]; then
            kill "$(cat /tmp/partgraph-phase9-browser.pid)" >/dev/null 2>&1 || true
          fi
          if [ -f /tmp/partgraph-phase9-browser.log ]; then
            cat /tmp/partgraph-phase9-browser.log
          fi

  randomized-acceptance:
