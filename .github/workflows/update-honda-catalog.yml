name: Update Honda catalog

on:
  workflow_dispatch:
  push:
    branches:
      - partgraph-honda-catalog
    paths:
      - scripts/build_honda_catalog.py
      - .github/workflows/update-honda-catalog.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/build_honda_catalog.py
      - .github/workflows/update-honda-catalog.yml
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: write

concurrency:
  group: honda-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build deterministic Honda configuration catalog
        run: python scripts/build_honda_catalog.py --out public/data/honda
      - name: Validate generated catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('public/data/honda')
          index = json.loads((root / 'catalog-index.json').read_text())
          assert index['recordCount'] >= 500
          assert index['yearCount'] >= 20
          assert index['modelCount'] >= 10
          sample = json.loads((root / 'validation-sample.json').read_text())['records']
          assert len(sample) == 20
          for item in sample:
              assert item['sourceUrl'].startswith('https://www.hondapartsnow.com/')
              assert item['configurationLabel']
          print(json.dumps({k: index[k] for k in ['recordCount','yearCount','modelCount','years']}, indent=2))
          PY
      - name: Commit refreshed catalog
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -z "$(git status --porcelain -- public/data/honda)" ]; then
            echo 'Catalog unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/honda
          git commit -m 'Refresh Honda vehicle catalog [catalog-data]'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
