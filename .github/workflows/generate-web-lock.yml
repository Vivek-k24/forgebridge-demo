name: Generate Web Lockfile

on:
  push:
    branches: [partgraph-block-4-auth-isolation]
    paths:
      - 'web/package.json'
      - '.github/workflows/generate-web-lock.yml'

permissions:
  contents: write

concurrency:
  group: generate-web-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: partgraph-block-4-auth-isolation

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate package lock without lifecycle scripts
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- web/package-lock.json && git ls-files --error-unmatch web/package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json already matches package.json'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/package-lock.json
          git commit -m 'Block 4: lock Web transitive dependencies'
          git push origin HEAD:partgraph-block-4-auth-isolation
