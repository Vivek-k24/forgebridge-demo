name: Reference Repair Runtime CI

on:
  pull_request:
    paths:
      - 'api/data/reference/2009_honda_civic_hybrid_repairs_v1/**'
      - 'api/data/reference/2009_honda_civic_hybrid_profile_v1/**'
      - 'api/partgraph/repair_experience/**'
      - 'api/partgraph/repair_definition/**'
      - 'api/partgraph/knowledge/repair_materialization*.py'
      - 'api/partgraph/knowledge/downstream_materialization.py'
      - 'api/partgraph/knowledge/vehicle_domain_materialization.py'
      - 'api/partgraph/knowledge/repair_service.py'
      - 'api/partgraph/knowledge/procedure_service.py'
      - 'api/tests/test_reference_repair_runtime.py'
      - 'api/tests/test_reference_photo_storage_runtime.py'
      - 'api/tests/test_reference_downstream_runtime.py'
      - 'api/tests/test_reference_primary_vehicle_runtime.py'
      - 'api/migrations/**'
      - 'api/pyproject.toml'
      - '.github/workflows/reference-runtime.yml'
  push:
    branches:
      - main
      - partgraph-mvp-consolidation
    paths:
      - 'api/data/reference/2009_honda_civic_hybrid_repairs_v1/**'
      - 'api/data/reference/2009_honda_civic_hybrid_profile_v1/**'
      - 'api/partgraph/repair_experience/**'
      - 'api/partgraph/repair_definition/**'
      - 'api/partgraph/knowledge/repair_materialization*.py'
      - 'api/partgraph/knowledge/downstream_materialization.py'
      - 'api/partgraph/knowledge/vehicle_domain_materialization.py'
      - 'api/partgraph/knowledge/repair_service.py'
      - 'api/partgraph/knowledge/procedure_service.py'
      - 'api/tests/test_reference_repair_runtime.py'
      - 'api/tests/test_reference_photo_storage_runtime.py'
      - 'api/tests/test_reference_downstream_runtime.py'
      - 'api/tests/test_reference_primary_vehicle_runtime.py'
      - 'api/migrations/**'
      - 'api/pyproject.toml'
      - '.github/workflows/reference-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-runtime:
    name: Civic Hybrid repair runtime gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: partgraph
          POSTGRES_USER: partgraph
          POSTGRES_PASSWORD: partgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partgraph -d partgraph"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install API dependencies
        run: python -m pip install -e './api[dev]'

      - name: Lint reference runtime boundary
        run: >-
          ruff check
          api/partgraph/repair_experience
          api/partgraph/repair_definition
          api/partgraph/knowledge/repair_materialization.py
          api/partgraph/knowledge/repair_materialization_contract.py
          api/partgraph/knowledge/repair_materialization_service.py
          api/partgraph/knowledge/downstream_materialization.py
          api/partgraph/knowledge/vehicle_domain_materialization.py
          api/partgraph/knowledge/repair_service.py
          api/partgraph/knowledge/procedure_service.py
          api/tests/test_reference_repair_runtime.py
          api/tests/test_reference_photo_storage_runtime.py
          api/tests/test_reference_downstream_runtime.py
          api/tests/test_reference_primary_vehicle_runtime.py

      - name: Apply database migrations
        env:
          PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
        run: alembic -c api/alembic.ini upgrade head

      - name: Run reference repair runtime acceptance
        env:
          PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
        run: >-
          python -m unittest discover -s api/tests
          -p 'test_reference_*_runtime.py'
