name: Production UI Hotfix Validation

on:
  pull_request:
    paths:
      - 'web/**'
      - 'api/partgraph/identity/auth/**'
      - 'api/tests/test_auth_security.py'
      - '.github/workflows/mvp-hotfix-validation.yml'

permissions:
  contents: read

jobs:
  hotfix:
    name: MVP merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: partgraph
          POSTGRES_USER: partgraph
          POSTGRES_PASSWORD: partgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partgraph -d partgraph"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build production Web
        working-directory: web
        env:
          VITE_API_BASE_URL: ''
        run: npm run build

      - name: Verify product-chrome contract
        run: |
          grep -q "Password requirements" web/src/AuthGate.tsx
          grep -q "Show password" web/src/AuthGate.tsx
          grep -q "Hide password" web/src/AuthGate.tsx
          grep -q "Privacy Policy" web/src/SiteFooter.tsx
          grep -q "Contact Us" web/src/SiteFooter.tsx
          grep -q 'aria-label="Text size"' web/src/AccountSettings.tsx

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install API dependencies
        run: python -m pip install -e './api[test]'

      - name: Apply current Production-compatible migrations
        env:
          PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
        run: alembic -c api/alembic.ini upgrade head

      - name: Test authentication and identity conflicts
        env:
          PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@127.0.0.1:5432/partgraph
        run: pytest api/tests/test_auth_security.py -q
