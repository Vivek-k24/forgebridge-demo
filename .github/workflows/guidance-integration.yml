name: Verified Guidance Integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guidance-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verified-guidance:
    name: Block 10 to 11 verified guidance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare ephemeral VIN protection keys
        run: |
          VIN_ENCRYPTION_KEY="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '\n')"
          VIN_LOOKUP_KEY="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '\n')"
          echo "PARTGRAPH_VIN_ENCRYPTION_KEYS={\"1\":\"${VIN_ENCRYPTION_KEY}\"}" >> "$GITHUB_ENV"
          echo "PARTGRAPH_VIN_ACTIVE_KEY_VERSION=1" >> "$GITHUB_ENV"
          echo "PARTGRAPH_VIN_LOOKUP_KEY=${VIN_LOOKUP_KEY}" >> "$GITHUB_ENV"

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build and start PartGraph stack
        run: docker compose up -d --build

      - name: Wait for API and reverse proxy
        run: |
          for attempt in $(seq 1 45); do
            API_OK=0
            PROXY_OK=0
            curl --fail --silent --show-error \
              http://127.0.0.1:8000/api/v1/health/ready >/dev/null && API_OK=1 || true
            curl --fail --silent --show-error \
              http://127.0.0.1:5173/api/v1/health/ready >/dev/null && PROXY_OK=1 || true
            if [ "$API_OK" -eq 1 ] && [ "$PROXY_OK" -eq 1 ]; then
              exit 0
            fi
            if [ "$attempt" -eq 45 ]; then
              docker compose ps
              docker compose logs --no-color
              exit 1
            fi
            sleep 2
          done

      - name: Seed deterministic verified repair truth
        run: |
          docker compose cp .github/scripts/seed_block11_guidance.py \
            api:/tmp/seed_block11_guidance.py
          FIXTURE=$(docker compose exec -T api python /tmp/seed_block11_guidance.py)
          echo "$FIXTURE"
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["supported_repair_key"] == "ci-guided-service"; assert p["prohibited_repair_key"] == "ci-guided-prohibited"' \
            <<< "$FIXTURE"
          echo "BLOCK11_FIXTURE=$FIXTURE" >> "$GITHUB_ENV"

      - name: Verify exact readiness to guidance journey
        shell: bash
        run: |
          set -euo pipefail

          API='http://127.0.0.1:5173/api/v1'
          PASSWORD='PartGraph-ci-password-123!'
          OWNER_USER="guide_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          OWNER_EMAIL="guide-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          STRANGER_USER="stranger_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          STRANGER_EMAIL="stranger-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          OWNER_COOKIE=/tmp/partgraph-guidance-owner.cookies
          STRANGER_COOKIE=/tmp/partgraph-guidance-stranger.cookies
          DEVICE=$(python -c 'import uuid; print(uuid.uuid4())')
          BOUNDARY_DEVICE=$(python -c 'import uuid; print(uuid.uuid4())')

          CONFIG_ID=$(python -c 'import json,os; print(json.loads(os.environ["BLOCK11_FIXTURE"])["configuration_id"])')
          SUPPORTED_KEY=$(python -c 'import json,os; print(json.loads(os.environ["BLOCK11_FIXTURE"])["supported_repair_key"])')
          PROHIBITED_KEY=$(python -c 'import json,os; print(json.loads(os.environ["BLOCK11_FIXTURE"])["prohibited_repair_key"])')
          REQUIREMENT_ID=$(python -c 'import json,os; print(json.loads(os.environ["BLOCK11_FIXTURE"])["supported_requirement_id"])')

          OWNER=$(curl --fail --silent --show-error \
            -c "$OWNER_COOKIE" \
            -H 'Content-Type: application/json' \
            -H 'X-PartGraph-CSRF: 1' \
            --data "{\"email\":\"$OWNER_EMAIL\",\"username\":\"$OWNER_USER\",\"password\":\"$PASSWORD\"}" \
            "$API/auth/register")
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["user"]["username"] == sys.argv[1]' \
            "$OWNER_USER" <<< "$OWNER"

          VEHICLE=$(curl --fail --silent --show-error \
            -b "$OWNER_COOKIE" \
            -H 'Content-Type: application/json' \
            -H 'X-PartGraph-CSRF: 1' \
            --data '{"nickname":"Block 11 CI vehicle","selection":{"year":2009,"market":"US","make":"Honda","model":"Civic","trim":"Hybrid"}}' \
            "$API/user-vehicles/manual")
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["identity_resolution"] == "matched"; assert p["canonical_configuration_id"] == sys.argv[1]' \
            "$CONFIG_ID" <<< "$VEHICLE"
          VEHICLE_ID=$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$VEHICLE")

          SESSION=$(curl --fail --silent --show-error \
            -b "$OWNER_COOKIE" \
            -H 'Content-Type: application/json' \
            -H 'X-PartGraph-CSRF: 1' \
            -H "X-PartGraph-Device-ID: $DEVICE" \
            -H 'Idempotency-Key: ci_guidance_session_01' \
            --data "{\"user_vehicle_id\":\"$VEHICLE_ID\",\"title\":\"Verified guidance CI\"}" \
            "$API/repair-sessions")
          SESSION_ID=$(python -c 'import json,sys; p=json.load(sys.stdin); assert p["reorientation"]["next_verified_action"]["reason"] == "repair_plan_not_available"; print(p["session"]["id"])' <<< "$SESSION")

          OPTIONS=$(curl --fail --silent --show-error \
            -b "$OWNER_COOKIE" \
            "$API/repair-sessions/$SESSION_ID/repair-options")
          python -c 'import json,sys; p=json.load(sys.stdin); keys={x["repair_key"] for x in p["options"]}; assert p["vehicle_resolution"] == "exact"; assert {sys.argv[1],sys.argv[2]} <= keys' \
            "$SUPPORTED_KEY" "$PROHIBITED_KEY" <<< "$OPTIONS"

          BIND=$(curl --fail --silent --show-error \
            -b "$OWNER_COOKIE" \
            -X PUT \
            -H 'Content-Type: application/json' \
            -H 'X-PartGraph-CSRF: 1' \
            -H "X-PartGraph-Device-ID: $DEVICE" \
            --data "{\"repair_key\":\"$SUPPORTED_KEY\"}" \
            "$API/repair-sessions/$SESSION_ID/repair-definition")
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["repair_key"] == sys.argv[1]; assert p["binding_state"] == "bound"' \
            "$SUPPORTED_KEY" <<< "$BIND"

          READINESS=$(curl --fail --silent --show-error \
            -b "$OWNER_COOKIE" \
            "$API/repair-sessions/$SESSION_ID/readiness")
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["binding_status"] == "bound"; assert p["summary"]["blocked"] == 1; item=next(x for x in p["requirements"] if x["requirement_definition_id"] == sys.argv[1]); assert item["readiness_state"] == "missing"' \
            "$REQUIREMENT_ID" <<< "$READINESS"

          FIRST=$(curl --fail --silent --show-error \
            -b "$OWNER_COOKIE" \
            "$API/repair-sessions/$SESSION_ID/guidance")
          PREPARE_ID=$(python -c 'import json,sys; p=json.load(sys.stdin); assert p["status"] == "action_available"; assert p["current_action"]["action_key"] == "prepare"; print(p["current_action"]["action_id"])' <<< "$FIRST")

          AFTER_PREPARE=$(curl --fail --silent --show-error \
            -b "$OWNER_COOKIE" \
            -X PUT \
            -H 'Content-Type: application/json' \
            -H 'X-PartGraph-CSRF: 1' \
            -H "X-PartGraph-Device-ID: $DEVICE" \
            -H 'Idempotency-Key: ci_guidance_prepare_01' \
            --data '{"progress_state":"completed"}' \
            "$API/repair-sessions/$SESSION_ID/guidance/actions/$PREPARE_ID")
          SERVICE_ID=$(python -c 'import json,sys; p=json.load(sys.stdin); assert p["status"] == "inventory_blocked"; assert p["current_action"]["action_key"] == "service"; assert len(p["current_action"]["inventory_blockers"]) == 1; print(p["current_action"]["action_id"])' <<< "$AFTER_PREPARE")

          READY=$(curl --fail --silent --show-error \
            -b "$OWNER_COOKIE" \
            -X PUT \
            -H 'Content-Type: application/json' \
            -H 'X-PartGraph-CSRF: 1' \
            -H "X-PartGraph-Device-ID: $DEVICE" \
            -H 'Idempotency-Key: ci_guidance_ready_01' \
            --data '{"readiness_state":"have"}' \
            "$API/repair-sessions/$SESSION_ID/readiness/$REQUIREMENT_ID")
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["summary"]["blocked"] == 0; item=next(x for x in p["requirements"] if x["requirement_definition_id"] == sys.argv[1]); assert item["readiness_state"] == "have"' \
            "$REQUIREMENT_ID" <<< "$READY"

          AVAILABLE=$(curl --fail --silent --show-error \
            -b "$OWNER_COOKIE" \
            "$API/repair-sessions/$SESSION_ID/guidance")
          SERVICE_TITLE=$(python -c 'import json,sys; p=json.load(sys.stdin); assert p["status"] == "action_available"; assert p["current_action"]["action_id"] == sys.argv[1]; print(p["current_action"]["title"])' \
            "$SERVICE_ID" <<< "$AVAILABLE")

          PAUSED=$(curl --fail --silent --show-error \
            -b "$OWNER_COOKIE" \
            -X POST \
            -H 'X-PartGraph-CSRF: 1' \
            -H "X-PartGraph-Device-ID: $DEVICE" \
            -H 'Idempotency-Key: ci_guidance_pause_01' \
            "$API/repair-sessions/$SESSION_ID/pause")
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["session"]["status"] == "paused"' <<< "$PAUSED"

          PAUSED_RESUME=$(curl --fail --silent --show-error \
            -b "$OWNER_COOKIE" \
            -H "X-PartGraph-Device-ID: $DEVICE" \
            "$API/repair-sessions/$SESSION_ID/resume")
          python -c 'import json,sys; p=json.load(sys.stdin); a=p["reorientation"]["next_verified_action"]; assert p["session"]["status"] == "paused"; assert a["status"] == "available"; assert a["label"] == sys.argv[1]' \
            "$SERVICE_TITLE" <<< "$PAUSED_RESUME"

          RESUMED=$(curl --fail --silent --show-error \
            -b "$OWNER_COOKIE" \
            -X POST \
            -H 'X-PartGraph-CSRF: 1' \
            -H "X-PartGraph-Device-ID: $DEVICE" \
            -H 'Idempotency-Key: ci_guidance_resume_01' \
            "$API/repair-sessions/$SESSION_ID/resume")
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["session"]["status"] == "active"' <<< "$RESUMED"

          SAME_ACTION=$(curl --fail --silent --show-error \
            -b "$OWNER_COOKIE" \
            "$API/repair-sessions/$SESSION_ID/guidance")
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["current_action"]["action_id"] == sys.argv[1]; assert p["status"] == "action_available"' \
            "$SERVICE_ID" <<< "$SAME_ACTION"

          COMPLETED=$(curl --fail --silent --show-error \
            -b "$OWNER_COOKIE" \
            -X PUT \
            -H 'Content-Type: application/json' \
            -H 'X-PartGraph-CSRF: 1' \
            -H "X-PartGraph-Device-ID: $DEVICE" \
            -H 'Idempotency-Key: ci_guidance_service_01' \
            --data '{"progress_state":"completed"}' \
            "$API/repair-sessions/$SESSION_ID/guidance/actions/$SERVICE_ID")
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["status"] == "procedure_complete"; assert p["procedure_complete"] is True; assert p["current_action"] is None' <<< "$COMPLETED"

          COMPLETE_RESUME=$(curl --fail --silent --show-error \
            -b "$OWNER_COOKIE" \
            -H "X-PartGraph-Device-ID: $DEVICE" \
            "$API/repair-sessions/$SESSION_ID/resume")
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["reorientation"]["next_verified_action"]["reason"] == "procedure_complete"' <<< "$COMPLETE_RESUME"

          HISTORY=$(curl --fail --silent --show-error \
            -b "$OWNER_COOKIE" \
            "$API/repair-sessions/$SESSION_ID/events?limit=100")
          python -c 'import json,sys; p=json.load(sys.stdin); kinds=[x["event_type"] for x in p["items"]]; required={"session_started","readiness_state_changed","procedure_action_state_changed","session_paused","session_resumed"}; assert required <= set(kinds); assert [x["sequence"] for x in p["items"]] == list(range(1,len(p["items"])+1))' <<< "$HISTORY"

          STRANGER=$(curl --fail --silent --show-error \
            -c "$STRANGER_COOKIE" \
            -H 'Content-Type: application/json' \
            -H 'X-PartGraph-CSRF: 1' \
            --data "{\"email\":\"$STRANGER_EMAIL\",\"username\":\"$STRANGER_USER\",\"password\":\"$PASSWORD\"}" \
            "$API/auth/register")
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["user"]["username"] == sys.argv[1]' \
            "$STRANGER_USER" <<< "$STRANGER"
          ISOLATION_STATUS=$(curl --silent --output /tmp/partgraph-guidance-isolation.json --write-out '%{http_code}' \
            -b "$STRANGER_COOKIE" \
            "$API/repair-sessions/$SESSION_ID/guidance")
          test "$ISOLATION_STATUS" = "404"
          python -c 'import json; p=json.load(open("/tmp/partgraph-guidance-isolation.json")); assert p["error"]["code"] == "REPAIR_SESSION_NOT_FOUND"'

          BOUNDARY_SESSION=$(curl --fail --silent --show-error \
            -b "$OWNER_COOKIE" \
            -H 'Content-Type: application/json' \
            -H 'X-PartGraph-CSRF: 1' \
            -H "X-PartGraph-Device-ID: $BOUNDARY_DEVICE" \
            -H 'Idempotency-Key: ci_guidance_boundary_session_01' \
            --data "{\"user_vehicle_id\":\"$VEHICLE_ID\",\"title\":\"Prohibited guidance CI\"}" \
            "$API/repair-sessions")
          BOUNDARY_SESSION_ID=$(python -c 'import json,sys; print(json.load(sys.stdin)["session"]["id"])' <<< "$BOUNDARY_SESSION")

          curl --fail --silent --show-error \
            -b "$OWNER_COOKIE" \
            -X PUT \
            -H 'Content-Type: application/json' \
            -H 'X-PartGraph-CSRF: 1' \
            -H "X-PartGraph-Device-ID: $BOUNDARY_DEVICE" \
            --data "{\"repair_key\":\"$PROHIBITED_KEY\"}" \
            "$API/repair-sessions/$BOUNDARY_SESSION_ID/repair-definition" >/dev/null

          BOUNDARY_STATUS=$(curl --silent --output /tmp/partgraph-guidance-boundary.json --write-out '%{http_code}' \
            -b "$OWNER_COOKIE" \
            "$API/repair-sessions/$BOUNDARY_SESSION_ID/guidance")
          test "$BOUNDARY_STATUS" = "403"
          python -c 'import json; p=json.load(open("/tmp/partgraph-guidance-boundary.json")); assert p["error"]["code"] == "REPAIR_GUIDANCE_PROHIBITED"'

          curl --fail --silent --show-error \
            -b "$OWNER_COOKIE" \
            -X PATCH \
            -H 'X-PartGraph-CSRF: 1' \
            -H "X-PartGraph-Device-ID: $BOUNDARY_DEVICE" \
            -H 'Idempotency-Key: ci_guidance_boundary_archive_01' \
            "$API/repair-sessions/$BOUNDARY_SESSION_ID/archive" >/dev/null

          curl --fail --silent --show-error \
            -b "$OWNER_COOKIE" \
            -X PATCH \
            -H 'X-PartGraph-CSRF: 1' \
            -H "X-PartGraph-Device-ID: $DEVICE" \
            -H 'Idempotency-Key: ci_guidance_archive_01' \
            "$API/repair-sessions/$SESSION_ID/archive" >/dev/null

      - name: Stop PartGraph stack
        if: always()
        run: docker compose down
