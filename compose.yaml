name: partgraph

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: partgraph
      POSTGRES_USER: partgraph
      POSTGRES_PASSWORD: partgraph
    ports:
      - "5432:5432"
    volumes:
      - partgraph_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partgraph -d partgraph"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ./api
    environment:
      PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@postgres:5432/partgraph
      PARTGRAPH_WEB_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./web
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  partgraph_postgres:
