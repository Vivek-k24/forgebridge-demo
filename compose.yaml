name: partgraph

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: partgraph
      POSTGRES_USER: partgraph
      POSTGRES_PASSWORD: partgraph
    ports:
      - "5432:5432"
    volumes:
      - partgraph_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partgraph -d partgraph"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ./api
    environment:
      PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@postgres:5432/partgraph
      PARTGRAPH_WEB_ORIGIN: http://localhost:5173
      PARTGRAPH_VIN_ENCRYPTION_KEYS: ${PARTGRAPH_VIN_ENCRYPTION_KEYS:-}
      PARTGRAPH_VIN_ACTIVE_KEY_VERSION: ${PARTGRAPH_VIN_ACTIVE_KEY_VERSION:-1}
      PARTGRAPH_VIN_LOOKUP_KEY: ${PARTGRAPH_VIN_LOOKUP_KEY:-}
      PARTGRAPH_VIN_CACHE_HOURS: ${PARTGRAPH_VIN_CACHE_HOURS:-720}
      PARTGRAPH_NHTSA_BASE_URL: ${PARTGRAPH_NHTSA_BASE_URL:-https://vpic.nhtsa.dot.gov/api/vehicles}
      PARTGRAPH_NHTSA_TIMEOUT_SECONDS: ${PARTGRAPH_NHTSA_TIMEOUT_SECONDS:-4.0}
      PARTGRAPH_MEDIA_ROOT: /app/media
      PARTGRAPH_PHOTO_MAX_BYTES: ${PARTGRAPH_PHOTO_MAX_BYTES:-15728640}
      PARTGRAPH_WORKBENCH_ENABLED: "true"
      PARTGRAPH_WORKBENCH_CACHE_ROOT: /app/workbench
      PARTGRAPH_WORKBENCH_FETCH_TIMEOUT_SECONDS: ${PARTGRAPH_WORKBENCH_FETCH_TIMEOUT_SECONDS:-8.0}
    ports:
      - "8000:8000"
    volumes:
      - partgraph_media:/app/media
      - ./local-data/workbench:/app/workbench
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10

  collector:
    build:
      context: ./api
    command: ["python", "-m", "partgraph.knowledge.workbench_worker"]
    environment:
      PARTGRAPH_DATABASE_URL: postgresql+psycopg://partgraph:partgraph@postgres:5432/partgraph
      PARTGRAPH_WEB_ORIGIN: http://localhost:5173
      PARTGRAPH_DATABASE_POOLING: "false"
      PARTGRAPH_WORKBENCH_ENABLED: "true"
      PARTGRAPH_WORKBENCH_CACHE_ROOT: /app/workbench
      PARTGRAPH_WORKBENCH_POLL_SECONDS: ${PARTGRAPH_WORKBENCH_POLL_SECONDS:-2.0}
      PARTGRAPH_WORKBENCH_FETCH_TIMEOUT_SECONDS: ${PARTGRAPH_WORKBENCH_FETCH_TIMEOUT_SECONDS:-8.0}
      PARTGRAPH_NHTSA_BASE_URL: ${PARTGRAPH_NHTSA_BASE_URL:-https://vpic.nhtsa.dot.gov/api/vehicles}
      PARTGRAPH_NHTSA_TIMEOUT_SECONDS: ${PARTGRAPH_NHTSA_TIMEOUT_SECONDS:-4.0}
    volumes:
      - ./local-data/workbench:/app/workbench
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: ""
        VITE_PARTGRAPH_WORKBENCH_ENABLED: "true"
    environment:
      PARTGRAPH_API_UPSTREAM: http://api:8000
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  partgraph_postgres:
  partgraph_media: