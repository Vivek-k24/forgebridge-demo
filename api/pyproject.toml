[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "partgraph-api"
version = "0.1.0"
description = "Interactive PartGraph API modular monolith"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi[standard]==0.141.1",
  "sqlalchemy>=2.0.43,<2.1",
  "psycopg[binary]>=3.2.9,<4",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
  "httpx>=0.28,<0.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
