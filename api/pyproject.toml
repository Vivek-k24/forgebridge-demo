[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "partgraph-api"
version = "0.4.0"
description = "Interactive PartGraph API modular monolith"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic==1.19.1",
  "argon2-cffi==25.1.0",
  "cryptography==50.0.1",
  "email-validator==2.3.0",
  "fastapi[standard]==0.141.1",
  "sqlalchemy==2.0.52",
  "psycopg[binary]==3.3.4",
]

[project.optional-dependencies]
test = [
  "httpx2==2.12.0",
  "pip-audit==2.10.1",
  "pytest==9.0.3",
  "ruff==0.16.4",
]

[tool.setuptools.packages.find]
include = ["partgraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py314"
line-length = 101

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.vercel]
entrypoint = "partgraph.main:app"

[tool.vercel.scripts]
build = "alembic -c alembic.ini upgrade head && python -m partgraph.identity.vehicle.canada_probe"
