[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "partgraph-api"
version = "0.4.0"
description = "Interactive PartGraph API modular monolith"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic==1.19.1",
  "argon2-cffi==25.1.0",
  "cryptography==50.0.1",
  "email-validator==2.3.0",
  "fastapi[standard]==0.141.1",
  "sqlalchemy==2.0.52",
  "psycopg[binary]==3.3.4",
]

[project.optional-dependencies]
dev = [
  "pip-audit==2.10.1",
  "ruff==0.16.4",
]

[tool.setuptools.packages.find]
include = ["partgraph*"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.vercel]
entrypoint = "partgraph.main:app"

[tool.vercel.fastapi.static]
cdn = false

[tool.vercel.scripts]
build = "sh -c 'python -m unittest discover -s tests -p \"test_equipment_catalog_seed.py\" && npm --prefix ../web ci && npm --prefix ../web run build && rm -rf partgraph/frontend && mkdir -p partgraph/frontend && cp -R ../web/dist/. partgraph/frontend/ && if [ \"$VERCEL_ENV\" = \"production\" ]; then alembic -c alembic.ini upgrade head; elif [ \"$VERCEL_ENV\" = \"preview\" ] && [ \"$VERCEL_GIT_COMMIT_REF\" = \"partgraph-mvp-consolidation\" ]; then alembic -c alembic.ini upgrade head; else echo Skipping database migrations for this Vercel deployment; fi'"
